<!doctype html>
<html lang="en">

<meta name="theme-color" content="#062d31">
<meta property="og:title" content="Made This Way (Brand Edition) — SmartLabDesign">
<meta property="og:description" content="An interactive 3D studio handbook. Drag the pages, flip through seven studio rules.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23062d31'/%3E%3Cpath d='M16 9c-3-1.6-6-1.6-9 0v15c3-1.6 6-1.6 9 0 3-1.6 6-1.6 9 0V9c-3-1.6-6-1.6-9 0z' fill='%23ffbc42' stroke='%23ff2d87' stroke-width='1.5'/%3E%3Cpath d='M16 9v15' stroke='%23062d31' stroke-width='1.5'/%3E%3C/svg%3E">
<title>Made This Way (Brand Edition) — SmartLabDesign</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: full-screen WebGL stage (3D book on a dark table), thin HTML UI layer on top: header, open button + dedication, arrows, dots, footer. */
:root{
  --ink:#062d31;--ink-deep:#021a19;--cream:#fff0ce;--cream-mute:rgba(255,240,206,.55);--coral:#ff6848;--pink:#ff2d87;--aqua:#00bfc4;--sun:#ffbc42;--paper:#f7ddad;
  --fd:"Archivo Black","Arial Black",sans-serif;--ft:"Barlow Condensed","Arial Narrow",sans-serif;--fm:"DM Mono",ui-monospace,monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ink-deep)}
body{--fg:var(--cream);--fgm:var(--cream-mute);transition:background-color .5s}
body:not([data-bg]){background:var(--table,var(--ink-deep)) center/cover no-repeat}
body[data-bg=flat]{background:radial-gradient(ellipse 90% 80% at 50% 42%,var(--bgc),color-mix(in srgb,var(--bgc),#000 34%));--vig:.28}
body[data-bg=hero]{background:linear-gradient(180deg,rgba(0,27,31,.5),transparent 30%,transparent 60%,rgba(0,25,29,.7)),url(../assets/smartlab-miami.webp) 57% center/cover no-repeat var(--ink-deep);--vig:.5}
body[data-ui=ink]{--fg:var(--ink);--fgm:rgba(6,45,49,.62)}
body{color:var(--cream);font-family:var(--ft);-webkit-font-smoothing:antialiased}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;pointer-events:none}
html,body{touch-action:none}body{cursor:pointer}
.back{position:fixed;inset:0;pointer-events:none}
.back button{pointer-events:auto}
.vig{position:fixed;inset:0;pointer-events:none;opacity:var(--vig,1);transition:opacity .5s;background:radial-gradient(ellipse 80% 70% at 50% 45%,transparent 40%,rgba(1,14,14,.78) 100%)}
.ui{position:fixed;inset:0;pointer-events:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ui a,.ui button{pointer-events:auto}
:focus-visible{outline:3px solid var(--sun);outline-offset:4px}

.logo{position:absolute;top:calc(18px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:none;border:0;color:var(--fg);
  font:400 13px/0.95 var(--fd);letter-spacing:-.02em;text-transform:uppercase;text-align:center;cursor:pointer;padding:8px 12px}
.logo span{color:var(--sun)}

.intro{position:absolute;left:50%;bottom:calc(64px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(520px,calc(100% - 32px));
  display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;transition:opacity .6s,transform .6s}
.open-btn{pointer-events:auto;display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 22px;border:1.5px solid var(--fg);border-radius:999px;background:rgba(2,26,25,.6);
  color:var(--cream);font:500 11px var(--fm);letter-spacing:.14em;text-transform:uppercase;cursor:pointer;backdrop-filter:blur(6px);transition:background .25s,color .25s,box-shadow .25s}
.open-btn:hover{background:var(--sun);color:var(--ink);border-color:var(--sun);box-shadow:5px 5px 0 var(--pink)}
.open-btn svg{width:18px;height:18px}
.ded{margin:0;font-size:20px;font-weight:600;line-height:1.3;color:var(--fg)}
.ded small{display:block;font:400 10px var(--fm);letter-spacing:.14em;text-transform:uppercase;color:var(--fgm);margin-top:8px}

.arrow{position:absolute;top:50%;transform:translateY(-50%);width:64px;height:64px;border:0;background:none;color:var(--fg);cursor:pointer;opacity:0;transition:opacity .5s,color .2s}
.arrow svg{width:28px;height:20px}
.arrow:hover{color:var(--sun)}
.prev{left:max(12px,env(safe-area-inset-left,0px))}
.next{right:max(12px,env(safe-area-inset-right,0px))}
.dots{position:absolute;left:50%;bottom:calc(52px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;align-items:flex-end;gap:2px;height:64px;padding:0 14px;opacity:0;transition:opacity .5s;touch-action:none;pointer-events:auto;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.dot{width:30px;height:30px;border:0;background:none;padding:0;cursor:pointer;display:grid;place-items:center;transform-origin:50% 100%;transition:transform .14s ease-out}
.dot i{width:var(--w,13px);height:13px;border-radius:7px;transition:width .16s ease-out;background:var(--c);box-shadow:0 0 0 1.5px var(--fgm);transition:box-shadow .2s}
.dot[aria-current="true"] i{box-shadow:0 0 0 2px var(--fg),3px 3px 0 2px var(--pink)}
.preview{position:absolute;left:0;bottom:0;width:212px;transform:translate(-50%,8px) scale(.92);transform-origin:50% 100%;opacity:0;pointer-events:none;
  transition:opacity .2s,transform .25s cubic-bezier(.2,1.5,.4,1);background:var(--ink);border:2px solid var(--cream);border-radius:4px 18px 4px 18px;overflow:hidden;box-shadow:7px 7px 0 var(--pink)}
.preview.on{opacity:1;transform:translate(-50%,0) scale(1)}
.preview img{display:block;width:100%;aspect-ratio:2.04/1;object-fit:cover;max-width:100%}
.preview span{display:block;padding:8px 10px 9px;font:500 10px var(--fm);letter-spacing:.12em;text-transform:uppercase;color:var(--cream)}
.arrow svg{transition:transform .25s cubic-bezier(.2,1.5,.4,1)}
.next:hover svg{transform:translateX(7px)}.prev:hover svg{transform:translateX(-7px)}
.cta{position:absolute;left:calc(50% + var(--ctax,24vw));right:auto;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:stretch;gap:18px;opacity:0;visibility:hidden;transition:opacity .5s;width:min(300px,calc(100% - 32px))}
.cta .btn{justify-content:center;min-height:52px;font-size:18px}
.btn{pointer-events:auto;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border:2px solid var(--ink);border-radius:3px;background:var(--sun);color:var(--ink);
  font:800 15px var(--ft);text-transform:uppercase;letter-spacing:.03em;text-decoration:none;cursor:pointer;box-shadow:6px 6px 0 var(--pink);transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translate(-3px,-3px);box-shadow:9px 9px 0 var(--pink)}
.btn.alt{background:var(--aqua)}
.cta .btn:nth-child(1){background:var(--sun)}
.cta .btn:nth-child(2){background:var(--aqua);box-shadow:6px 6px 0 var(--pink)}
.cta .btn:nth-child(3){background:var(--pink);color:var(--cream,#fff8e1);box-shadow:6px 6px 0 var(--aqua)}
.cta .btn:nth-child(3):hover{box-shadow:9px 9px 0 var(--aqua)}
.cta .btn:nth-child(4){background:var(--coral);color:var(--ink);box-shadow:6px 6px 0 var(--aqua)}
.cta .btn:nth-child(4):hover{box-shadow:9px 9px 0 var(--aqua)}

body.is-open .intro{opacity:0;transform:translate(-50%,20px);pointer-events:none}
body.is-open .intro *{pointer-events:none}
body.is-open .arrow,body.is-open .dots{opacity:1}
body:not(.is-open) .arrow,body:not(.is-open) .dot{pointer-events:none}
body.at-end .cta{opacity:1;visibility:visible;transition:opacity .5s 1.3s,visibility 0s 1.3s}
.arrow:disabled{opacity:.2!important;cursor:default}

.loader{position:fixed;inset:0;display:grid;place-items:center;background:var(--ink-deep);font:400 11px var(--fm);letter-spacing:.16em;text-transform:uppercase;color:var(--cream-mute);transition:opacity .8s;z-index:5}
.loader.done{opacity:0;pointer-events:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:640px){
  .ded{font-size:17px}
  .arrow{top:auto;bottom:calc(46px + env(safe-area-inset-bottom,0px));transform:none;width:52px;height:52px}
  .dots{bottom:calc(60px + env(safe-area-inset-bottom,0px))}
}
@media (max-aspect-ratio:17/20){.cta{left:50%;right:auto;top:auto;bottom:calc(122px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:grid;grid-template-columns:1fr 1fr;gap:14px;width:min(420px,calc(100% - 40px))}.cta .btn{font-size:15px;padding:0 10px}}
.bgbtn{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px));width:44px;height:44px;border-radius:50%;border:1.5px solid var(--fg);background:rgba(2,26,25,.55);color:var(--cream);display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(6px);pointer-events:auto}
.bgbtn svg{width:20px;height:20px}
.bgpop{position:absolute;top:calc(64px + env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px;padding:12px;border:1.5px solid var(--cream);border-radius:4px 18px 4px 18px;background:rgba(2,26,25,.86);backdrop-filter:blur(8px);box-shadow:5px 5px 0 var(--pink);pointer-events:auto}
.bgpop[hidden]{display:none}
.sw{display:flex;align-items:center;gap:10px;min-height:34px;padding:0 10px 0 6px;border:0;border-radius:999px;background:none;color:var(--cream);font:500 10px var(--fm);letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
.sw i{width:22px;height:22px;border-radius:50%;background:var(--c);box-shadow:0 0 0 1.5px rgba(255,240,206,.6)}
.sw[aria-pressed="true"]{background:rgba(255,240,206,.14)}
.sw[aria-pressed="true"] i{box-shadow:0 0 0 2px var(--cream),3px 3px 0 2px var(--pink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-height:520px) and (orientation:landscape){
  .logo{top:calc(8px + env(safe-area-inset-top,0px));font-size:12px}
  .bgbtn{top:calc(8px + env(safe-area-inset-top,0px));width:38px;height:38px}.bgbtn svg{width:18px;height:18px}
  .arrow{width:44px;height:44px}.arrow svg{width:24px;height:17px}
  .dots{bottom:calc(6px + env(safe-area-inset-bottom,0px));height:40px}
  .dot{width:26px;height:26px}.dot i{height:11px}
  .preview{width:150px}.preview span{padding:5px 8px 6px;font-size:9px}
  .cta{gap:9px;width:min(210px,40vw)}.cta .btn{min-height:36px;font-size:13px;padding:0 10px;box-shadow:4px 4px 0 var(--pink)}
  .cta .btn:nth-child(3){box-shadow:4px 4px 0 var(--aqua)}.cta .btn:nth-child(4){box-shadow:4px 4px 0 var(--aqua)}
  .intro{bottom:calc(10px + env(safe-area-inset-bottom,0px));gap:8px}.ded{font-size:13px}.ded small{display:none}.open-btn{min-height:34px}
}
</style>
</head>
<body>
<div class="back">
  <div class="dots" id="dots" role="group" aria-label="Pages"></div>

  <div class="cta">
    <a class="btn" href="/voidsignal/" target="_blank" rel="noopener">Void Signal ↗</a>
    <a class="btn alt" href="/giggiooo-burger-v2/" target="_blank" rel="noopener">Giggiooo Burger ↗</a>
    <a class="btn" href="/" target="_blank" rel="noopener">All the work ↗</a>
  </div>
</div>
<canvas id="gl" aria-label="Made This Way, an interactive 3D book of SmartLabDesign projects"></canvas>

<div class="ui">
  <div class="preview" id="preview" aria-hidden="true"><img id="pimg" alt=""><span id="plab"></span></div>
  <button class="logo" id="home" aria-label="Close the book">Made <span>this</span><br>way</button>

  <div class="intro">
    <button class="open-btn" id="open"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 5.5c3-1.4 6-1.4 9 .5 3-1.9 6-1.9 9-.5V19c-3-1.4-6-1.4-9 .5-3-1.9-6-1.9-9-.5z"/><path d="M12 6v13.5"/></svg>Open book</button>
    <p class="ded">Projects the studio shipped, and how they were made.<br>Brand Edition<small>Alessio, SmartLabDesign</small></p>
  </div>

  <button class="arrow prev" id="prev" aria-label="Previous page"><svg viewBox="0 0 28 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M26 11.4C20 9.5 13 11.3 2.6 10"/><path d="M24.5 9C18 10.8 11 9.3 3.4 10.7" stroke-width="1.1" opacity=".55"/><path d="M10.4 2.4C7.4 5.8 4.4 8.5 1.4 10.2 4.5 12.6 7.6 15.6 10.8 18.2"/></svg></button>
  <button class="arrow next" id="next" aria-label="Next page"><svg viewBox="0 0 28 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 11.4C8 9.5 15 11.3 25.4 10"/><path d="M3.5 9C10 10.8 17 9.3 24.6 10.7" stroke-width="1.1" opacity=".55"/><path d="M17.6 2.4C20.6 5.8 23.6 8.5 26.6 10.2 23.5 12.6 20.4 15.6 17.2 18.2"/></svg></button>


  <button class="bgbtn" id="bgbtn" aria-label="Change background" aria-expanded="false" aria-controls="bgpop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18c1.4 0 2-.9 2-1.8 0-1.4-1.2-1.6-1.2-2.9 0-1 .8-1.6 1.8-1.6H17a4 4 0 0 0 4-4C21 6.4 17 3 12 3z"/><circle cx="7.5" cy="11" r="1" fill="currentColor"/><circle cx="10.5" cy="7" r="1" fill="currentColor"/><circle cx="15" cy="7.5" r="1" fill="currentColor"/></svg></button>
  <div class="bgpop" id="bgpop" role="group" aria-label="Background" hidden></div>
</div>
<div class="loader" id="loader">Setting up the book</div>
<p class="sr" aria-live="polite" id="live"></p>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(async () => {
const I='#062d31',C='#fff0ce',P='#f7ddad',CO='#ff6848',PK='#ff2d87',AQ='#00bfc4',SU='#ffbc42';
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const W=1, H=0.98, PW=1024, PH=Math.round(1024*H), RAD=74, GAP=0.0034, SEG=56;

try{ await Promise.race([Promise.all(['400 100px "Archivo Black"','800 40px "Barlow Condensed"','600 40px "Barlow Condensed"','500 20px "DM Mono"','italic 700 100px "Barlow Condensed"'].map(f=>document.fonts.load(f))), new Promise(r=>setTimeout(r,3500))]); }catch(e){}

/* ---------- canvas helpers ---------- */
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
const LS=(x,v)=>{ if('letterSpacing' in x) x.letterSpacing=v; };
function wrap(x,text,maxW){const words=text.split(' ');const lines=[];let l='';for(const w of words){const t=l?l+' '+w:w;if(x.measureText(t).width>maxW&&l){lines.push(l);l=w}else l=t}if(l)lines.push(l);return lines}
function grain(x,w,h,a=.05){for(let i=0;i<w*h/90;i++){x.fillStyle=Math.random()<.5?`rgba(0,0,0,${a})`:`rgba(255,255,255,${a*.8})`;x.fillRect(Math.random()*w,Math.random()*h,1.6,1.6)}}
function star(x,cx,cy,r,ri){x.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4-Math.PI/2,rr=i%2?ri:r;x.lineTo(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr)}x.closePath()}

function bigWord(x,word,cx,cy,maxW,maxH,{fill,sh,ol},rot=-0.04){
  x.save();x.translate(cx,cy);x.rotate(rot);
  let fs=400;x.font=`400 ${fs}px "Archivo Black"`;LS(x,`${-fs*.045}px`);
  const m=x.measureText(word).width;fs=Math.min(fs*maxW/m,maxH);x.font=`400 ${fs}px "Archivo Black"`;LS(x,`${-fs*.045}px`);
  x.textAlign='center';x.textBaseline='middle';
  const o=fs*.06;
  x.lineJoin='round';x.strokeStyle=ol;x.lineWidth=fs*.022;x.strokeText(word,o*2.2,o*2.4);
  x.fillStyle=sh;x.fillText(word,o,o*1.1);
  x.fillStyle=fill;x.fillText(word,0,0);
  x.restore();
}
function block(x,o){
  let {x0,y,w,col}=o; x.textAlign='left';x.textBaseline='alphabetic';
  x.fillStyle=col;x.globalAlpha=.75;x.font='500 21px "DM Mono"';LS(x,'3px');x.fillText(o.kicker.toUpperCase(),x0,y);x.globalAlpha=1;y+=58;
  x.font='800 54px "Barlow Condensed"';LS(x,'0px');
  for(const l of wrap(x,o.title.toUpperCase(),w)){x.fillText(l,x0,y);y+=52} y+=10;
  x.font='600 29px "Barlow Condensed"';
  for(const l of wrap(x,o.body,w)){x.fillText(l,x0,y);y+=36} y+=18;
  if(o.tip){
    x.font='600 27px "Barlow Condensed"';const tl=wrap(x,o.tip,w-60);const bh=64+tl.length*33;
    x.fillStyle=o.tipSh;x.beginPath();x.roundRect(x0+12,y+12,w,bh,[6,38,6,38]);x.fill();
    x.fillStyle=o.tipBg;x.strokeStyle=I;x.lineWidth=4;x.beginPath();x.roundRect(x0,y,w,bh,[6,38,6,38]);x.fill();x.stroke();
    x.fillStyle=o.tipFg;x.font='500 17px "DM Mono"';LS(x,'3px');x.fillText('TRY THIS',x0+30,y+36);LS(x,'0px');
    x.font='600 27px "Barlow Condensed"';tl.forEach((l,i)=>x.fillText(l,x0+30,y+72+i*33));
  }
  if(o.lines){x.font='500 22px "DM Mono"';LS(x,'1px');o.lines.forEach((l,i)=>{x.fillStyle=i%2?C:SU;x.fillText(l,x0,y+i*38)})}
}

/* ---------- motifs (left page area) ---------- */
const M={
  listen(x){x.lineCap='round';[110,190,90,240,150,280,120,200,80].forEach((h,i)=>{const bx=200+i*62,by=780;x.fillStyle=PK;x.fillRect(bx+10,by-h/2+10,36,h);x.fillStyle=AQ;x.fillRect(bx,by-h/2,36,h)});
    x.strokeStyle=SU;x.lineWidth=12;[70,120,170].forEach(r=>{x.beginPath();x.arc(820,780,r,-.9,.9);x.stroke()})},
  idea(x){x.fillStyle=C;for(let i=0;i<40;i++){x.beginPath();x.arc(120+(i*137)%820,560+(i*89)%400,3+(i%3)*2,0,7);x.fill()}
    star(x,520+18,760+18,230,70);x.fillStyle=I;x.fill();star(x,520,760,230,70);x.fillStyle=SU;x.fill();x.strokeStyle=I;x.lineWidth=10;x.stroke();
    x.fillStyle=C;x.beginPath();x.arc(520,760,26,0,7);x.fill()},
  borrow(x){x.strokeStyle=I;x.lineWidth=12;x.lineCap='round';for(let i=0;i<12;i++){const a=i*Math.PI/6;x.beginPath();x.moveTo(340+Math.cos(a)*150,700+Math.sin(a)*150);x.lineTo(340+Math.cos(a)*190,700+Math.sin(a)*190);x.stroke()}
    x.fillStyle=CO;x.beginPath();x.arc(340,700,120,0,7);x.fill();x.stroke();
    x.save();x.translate(640,800);x.rotate(-.7);x.fillStyle=I;x.fillRect(-18,120,36,170);x.fillStyle=PK;x.beginPath();x.arc(14,14,135,0,7);x.fill();
    x.fillStyle='rgba(255,240,206,.55)';x.beginPath();x.arc(0,0,135,0,7);x.fill();x.lineWidth=22;x.stroke();x.restore()},
  sketch(x){x.strokeStyle=I;x.lineWidth=10;x.lineCap='round';x.setLineDash([4,26]);x.beginPath();x.moveTo(140,820);
    for(let i=0;i<8;i++)x.quadraticCurveTo(190+i*90,i%2?660:960,240+i*90,820);x.stroke();x.setLineDash([]);
    x.save();x.translate(560,690);x.rotate(.55);x.fillStyle=PK;x.fillRect(-160+12,-36+12,330,72);x.fillStyle=C;x.strokeStyle=I;x.lineWidth=8;
    x.fillRect(-160,-36,280,72);x.strokeRect(-160,-36,280,72);x.fillStyle=CO;x.fillRect(120,-36,50,72);x.strokeRect(120,-36,50,72);
    x.fillStyle=P;x.beginPath();x.moveTo(-160,-36);x.lineTo(-230,0);x.lineTo(-160,36);x.closePath();x.fill();x.stroke();

  {k:'table',n:'Night table',c:'#021a19',ui:'cream'},
  {k:'ink',n:'Studio ink',c:'#062d31',ui:'cream'},
  {k:'coral',n:'Coral',c:'#ff6848',ui:'ink'},
  {k:'pink',n:'Pink',c:'#ff2d87',ui:'cream'},
  {k:'aqua',n:'Aqua',c:'#00bfc4',ui:'ink'},
  {k:'sun',n:'Sun',c:'#ffbc42',ui:'ink'},
  {k:'paper',n:'Paper',c:'#f7ddad',ui:'ink'},
  {k:'hero',n:'Site hero',c:'#7a3d2e',ui:'cream',img:true}];
const bgpop=document.getElementById('bgpop'),bgbtn=document.getElementById('bgbtn');
function setBg(k,save=true){const o=BGS.find(b=>b.k===k)||BGS[0],bd=document.body;
  bd.dataset.bg=o.k==='table'?'':o.img?'hero':'flat';if(!bd.dataset.bg)delete bd.dataset.bg;
  bd.style.setProperty('--bgc',o.c);if(o.ui==='ink')bd.dataset.ui='ink';else delete bd.dataset.ui;
  document.querySelector('meta[name=theme-color]').content=o.c;
  bgpop.querySelectorAll('.sw').forEach(s=>s.setAttribute('aria-pressed',String(s.dataset.k===o.k)));
  if(save)try{localStorage.setItem('iiw-bg',o.k)}catch(_){}}
BGS.forEach(o=>{const b=document.createElement('button');b.type='button';b.className='sw';b.dataset.k=o.k;b.setAttribute('aria-pressed','false');
  b.innerHTML=`<i style="--c:${o.c}${o.img?';background:url(../assets/smartlab-miami.webp) 60% center/cover':''}"></i>${o.n}`;b.onclick=()=>setBg(o.k);bgpop.appendChild(b)});
bgbtn.onclick=()=>{const on=bgpop.hidden;bgpop.hidden=!on;bgbtn.setAttribute('aria-expanded',String(on))};
addEventListener('pointerdown',e=>{if(!bgpop.hidden&&!bgpop.contains(e.target)&&!bgbtn.contains(e.target)){bgpop.hidden=true;bgbtn.setAttribute('aria-expanded','false')}});
{let s='table';try{s=localStorage.getItem('iiw-bg')||'table'}catch(_){}setBg(s,false)}

function ui(){
  document.body.classList.toggle('is-open',cur>0);
  const end=cur===NL;
  document.body.classList.toggle('at-end',end);
  dotEls.forEach((d,j)=>d.setAttribute('aria-current',String(j===cur-1)));
  document.getElementById('next').disabled=end;
  document.getElementById('live').textContent=names[cur];
}
document.getElementById('open').onclick=next;
document.getElementById('next').onclick=next;
document.getElementById('prev').onclick=prev;
document.getElementById('home').onclick=close;
addEventListener('keydown',e=>{if(e.key==='ArrowRight')next();else if(e.key==='ArrowLeft')prev();else if(e.key==='Escape'){if(!bgpop.hidden){bgpop.hidden=true;bgbtn.setAttribute('aria-expanded','false')}else close()}});
let wl=0;addEventListener('wheel',e=>{if(e.ctrlKey)return;const now=Date.now();if(now-wl<1100||Math.abs(e.deltaY)<25)return;wl=now;e.deltaY>0?next():prev()},{passive:true});
const copy=document.getElementById('copy');
if(copy)copy.onclick=()=>{const t='jamez.ichat@gmail.com',done=m=>{copy.textContent=m;setTimeout(()=>copy.textContent='Copy email',1800)};
  try{navigator.clipboard.writeText(t).then(()=>done('Copied'),()=>done(t))}catch(_){done(t)}};

/* ---------- gyroscope (mobile): drives the same tilt + page-layer parallax as the mouse ---------- */
var gyroOn=false;
const touchDev=matchMedia('(hover: none) and (pointer: coarse)').matches;
let gBase=null,gAsked=false;
function onOrient(e){
  if(e.beta==null||e.gamma==null)return;gyroOn=true;
  const ang=(screen.orientation&&screen.orientation.angle)||window.orientation||0;
  let gx=e.gamma,gy=e.beta;
  if(ang===90){gx=e.beta;gy=-e.gamma}else if(ang===-90||ang===270){gx=-e.beta;gy=e.gamma}else if(ang===180){gx=-e.gamma;gy=-e.beta}
  if(!gBase)gBase={x:gx,y:gy};
  // the neutral position slowly follows how the phone is being held
  gBase.x+=(gx-gBase.x)*.004;gBase.y+=(gy-gBase.y)*.004;
  ptr.x=Math.max(-1,Math.min(1,(gx-gBase.x)/20));ptr.y=Math.max(-1,Math.min(1,(gy-gBase.y)/20));
}
function enableGyro(){
  if(!touchDev||gyroOn||gAsked||RM)return;const D=window.DeviceOrientationEvent;if(!D)return;
  if(typeof D.requestPermission==='function'){gAsked=true;D.requestPermission().then(r=>{if(r==='granted')addEventListener('deviceorientation',onOrient)}).catch(()=>{gAsked=false})}
  else{gAsked=true;addEventListener('deviceorientation',onOrient)}
}
if(touchDev){
  // Android: starts right away. iOS: asks permission on the first tap (e.g. "Open book").
  if(!(window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission==='function'))enableGyro();
  addEventListener('pointerup',enableGyro);
}
addEventListener('orientationchange',()=>{gBase=null});

/* ---------- boot + loop ---------- */
resize();thick.r=TOP-PG*1.5;applyThick();
Object.assign(proxy,view());const v0=view();proxy.py*=1.35;proxy.pz*=1.35;proxy.ry=0.6;
gsap.to(proxy,{...v0,duration:RM?0:2.2,ease:'power3.out',delay:.2});
ui();
let tm=0;
renderer.setAnimationLoop(()=>{
  tm+=0.016;applyProxy();
  const k=RM?0:1;
  tilt.x+=(ptr.x-tilt.x)*.06;tilt.y+=(ptr.y-tilt.y)*.06;
  const amt=cur===0?1:.55;
  book.rotation.set(tilt.y*.10*amt*k,proxy.ry+(cur===0?tilt.x*.12*k:0),-tilt.x*.07*amt*k);
  layers.forEach(l=>{const f=live.v*k*l.d;l.mat.uniforms.shift.value.set(tilt.x*.02*f,-tilt.y*.018*f+(l.float?Math.sin(tm*1.4)*.003*live.v*k:0))});
  dl.position.set(-1.6+tilt.x*1.2,3,1.4+tilt.y*1.2);
  renderer.render(scene,cam);
});
document.getElementById('loader').classList.add('done');
})();
</script>
