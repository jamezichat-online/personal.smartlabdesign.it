riformi</option><option value="serrated">Dentellate</option></select></div><div class="field"><label for="foliage">Fogliame <span id="foliageV"></span></label><input id="foliage" type="range" min="1" max="7" value="4"></div><div class="field"><label for="stem">Colore dei rami</label><div class="branch-color"><input type="color" id="stem" value="#76504a"><output id="stemHex">#76504A</output></div><div class="swatches"><button type="button" data-stem="#76504a" style="--swatch:#76504a" aria-label="Rami marroni"></button><button type="button" data-stem="#49845b" style="--swatch:#49845b" aria-label="Rami verdi"></button><button type="button" data-stem="#394b36" style="--swatch:#394b36" aria-label="Rami verde bosco"></button><button type="button" data-stem="#aa7d5e" style="--swatch:#aa7d5e" aria-label="Rami color nocciola"></button></div></div><div class="field"><label for="density">Densità <span id="densityV"></span></label><input id="density" type="range" min="1" max="5" value="2"></div><div class="field"><label for="bloomSize">Dimensione fiori <span id="bloomSizeV"></span></label><input id="bloomSize" type="range" min="50" max="160" value="100"></div><button id="random" style="width:100%">Genera una nuova variante</button></div><div class="group"><h2>Palette</h2><div class="field"><label for="colorMode">Colore dei fiori</label><select id="colorMode"><option value="natural">Palette botaniche naturali</option><option value="custom">Personalizzato (specie singola)</option></select></div><div class="field"><label for="variant">Variante</label><select id="variant"><option value="mixed">Varianti miste</option><option value="0">Variante 1</option><option value="1">Variante 2</option><option value="2">Variante 3</option><option value="3">Variante 4</option></select></div><div class="colors"><div class="colorrow"><input type="color" id="petal" value="#e63768">Petali</div><div class="colorrow"><input type="color" id="leaf" value="#8ba88d">Foglie</div><div class="colorrow"><input type="color" id="ink" value="#48243e">Testo</div><div class="colorrow"><input type="color" id="bg" value="#e3dcf6">Sfondo</div></div></div><div class="group"><h2>Movimento</h2><div class="field"><label for="motionBlur">Motion blur negli spostamenti rapidi <input id="motionBlur" type="checkbox" checked style="accent-color:#537950;width:18px;height:18px"></label></div><div class="field"><label for="motion">Animazione</label><select id="motion"><option value="grow">Crescita e fioritura</option><option value="breathe">Breathing</option><option value="still">Fermo</option></select></div><div class="field"><label for="speed">Velocità <span id="speedV"></span></label><input id="speed" type="range" min="1" max="5" value="3"></div><div class="field"><label for="wind">Intensità vento <span id="windV"></span></label><input id="wind" type="range" min="0" max="5" value="1"></div></div>
