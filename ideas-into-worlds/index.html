<style>
/* Layout: full-screen WebGL stage (3D book on a dark table), thin HTML UI layer on top: header, open button + dedication, arrows, dots, footer. */
:root{
  --ink:#062d31;--ink-deep:#021a19;--cream:#fff0ce;--cream-mute:rgba(255,240,206,.55);--coral:#ff6848;--pink:#ff2d87;--aqua:#00bfc4;--sun:#ffbc42;--paper:#f7ddad;
  --fd:"Archivo Black","Arial Black",sans-serif;--ft:"Barlow Condensed","Arial Narrow",sans-serif;--fm:"DM Mono",ui-monospace,monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ink-deep)}
body{color:var(--cream);font-family:var(--ft);-webkit-font-smoothing:antialiased}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
.vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 80% 70% at 50% 45%,transparent 40%,rgba(1,14,14,.78) 100%)}
.ui{position:fixed;inset:0;pointer-events:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ui a,.ui button{pointer-events:auto}
:focus-visible{outline:3px solid var(--sun);outline-offset:4px}

.logo{position:absolute;top:calc(18px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:none;border:0;color:var(--cream);
  font:400 13px/0.95 var(--fd);letter-spacing:-.02em;text-transform:uppercase;text-align:center;cursor:pointer;padding:8px 12px}
.logo span{color:var(--sun)}

.intro{position:absolute;left:50%;bottom:calc(64px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(520px,calc(100% - 32px));
  display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;transition:opacity .6s,transform .6s}
.open-btn{pointer-events:auto;display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 22px;border:1.5px solid var(--cream);border-radius:999px;background:rgba(2,26,25,.6);
  color:var(--cream);font:500 11px var(--fm);letter-spacing:.14em;text-transform:uppercase;cursor:pointer;backdrop-filter:blur(6px);transition:background .25s,color .25s,box-shadow .25s}
.open-btn:hover{background:var(--sun);color:var(--ink);border-color:var(--sun);box-shadow:5px 5px 0 var(--pink)}
.open-btn svg{width:18px;height:18px}
.ded{margin:0;font-size:20px;font-weight:600;line-height:1.3;color:var(--cream)}
.ded small{display:block;font:400 10px var(--fm);letter-spacing:.14em;text-transform:uppercase;color:var(--cream-mute);margin-top:8px}

.arrow{position:absolute;top:50%;transform:translateY(-50%);width:64px;height:64px;border:0;background:none;color:var(--cream);cursor:pointer;opacity:0;transition:opacity .5s,color .2s}
.arrow svg{width:46px;height:20px}
.arrow:hover{color:var(--sun)}
.prev{left:max(12px,env(safe-area-inset-left,0px))}
.next{right:max(12px,env(safe-area-inset-right,0px))}
.dots{position:absolute;left:50%;bottom:calc(52px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;align-items:flex-end;gap:2px;height:64px;padding:0 14px;opacity:0;transition:opacity .5s}
.dot{width:30px;height:30px;border:0;background:none;padding:0;cursor:pointer;display:grid;place-items:center;transform-origin:50% 100%;transition:transform .14s ease-out}
.dot i{width:13px;height:13px;border-radius:50%;background:var(--c);box-shadow:0 0 0 1.5px rgba(255,240,206,.55);transition:box-shadow .2s}
.dot[aria-current="true"] i{box-shadow:0 0 0 2px var(--cream),3px 3px 0 2px var(--pink)}
.preview{position:absolute;bottom:calc(100% + 14px);left:0;width:212px;transform:translate(-50%,8px) scale(.92);transform-origin:50% 100%;opacity:0;pointer-events:none;
  transition:opacity .2s,transform .25s cubic-bezier(.2,1.5,.4,1);background:var(--ink);border:2px solid var(--cream);border-radius:4px 18px 4px 18px;overflow:hidden;box-shadow:7px 7px 0 var(--pink)}
.preview.on{opacity:1;transform:translate(-50%,0) scale(1)}
.preview img{display:block;width:100%;aspect-ratio:2.04/1;object-fit:cover;max-width:100%}
.preview span{display:block;padding:8px 10px 9px;font:500 10px var(--fm);letter-spacing:.12em;text-transform:uppercase;color:var(--cream)}
.arrow svg{transition:transform .25s cubic-bezier(.2,1.5,.4,1)}
.next:hover svg{transform:translateX(7px)}.prev:hover svg{transform:translateX(-7px)}
.cta{position:absolute;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-wrap:wrap;justify-content:center;gap:12px;opacity:0;visibility:hidden;transition:opacity .5s;width:calc(100% - 32px)}
.btn{pointer-events:auto;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border:2px solid var(--ink);border-radius:3px;background:var(--sun);color:var(--ink);
  font:800 15px var(--ft);text-transform:uppercase;letter-spacing:.03em;text-decoration:none;cursor:pointer;box-shadow:6px 6px 0 var(--pink);transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translate(-3px,-3px);box-shadow:9px 9px 0 var(--pink)}
.btn.alt{background:var(--aqua)}

footer{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;
  padding:10px max(20px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));
  font:400 10px var(--fm);letter-spacing:.12em;text-transform:uppercase;color:var(--cream-mute)}
footer nav{display:flex;gap:18px;flex-wrap:wrap}
footer a{color:var(--cream);text-decoration:none;pointer-events:auto;padding-block:6px}
footer a:hover{color:var(--sun)}
footer b{color:var(--cream);font-weight:500}

body.is-open .intro{opacity:0;transform:translate(-50%,20px);pointer-events:none}
body.is-open .intro *{pointer-events:none}
body.is-open .arrow,body.is-open .dots{opacity:1}
body:not(.is-open) .arrow,body:not(.is-open) .dot{pointer-events:none}
body.at-end .cta{opacity:1;visibility:visible}
.arrow:disabled{opacity:.2!important;cursor:default}

.loader{position:fixed;inset:0;display:grid;place-items:center;background:var(--ink-deep);font:400 11px var(--fm);letter-spacing:.16em;text-transform:uppercase;color:var(--cream-mute);transition:opacity .8s;z-index:5}
.loader.done{opacity:0;pointer-events:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:640px){
  .ded{font-size:17px}
  footer{justify-content:center;font-size:9px}
  footer .credit{display:none}
  .arrow{top:auto;bottom:calc(46px + env(safe-area-inset-bottom,0px));transform:none;width:52px;height:52px}
  .dots{bottom:calc(60px + env(safe-area-inset-bottom,0px))}
  .cta{bottom:calc(112px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<canvas id="gl" aria-label="Ideas Into Worlds, an interactive 3D book by SmartLabDesign"></canvas>

<div class="ui">
  <button class="logo" id="home" aria-label="Close the book">Ideas <span>into</span><br>worlds</button>

  <div class="intro">
    <button class="open-btn" id="open"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 5.5c3-1.4 6-1.4 9 .5 3-1.9 6-1.9 9-.5V19c-3-1.4-6-1.4-9 .5-3-1.9-6-1.9-9-.5z"/><path d="M12 6v13.5"/></svg>Open book</button>
    <p class="ded">For everyone who ever walked in with a scribble.<br>Keep drawing. The world part comes later.<small>Alessio, SmartLabDesign</small></p>
  </div>

  <button class="arrow prev" id="prev" aria-label="Previous page"><svg viewBox="0 0 46 20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M45 10H2M11 1 2 10l9 9"/></svg></button>
  <button class="arrow next" id="next" aria-label="Next page"><svg viewBox="0 0 46 20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 10h43M35 1l9 9-9 9"/></svg></button>
  <div class="dots" id="dots" role="group" aria-label="Pages"><div class="preview" id="preview" aria-hidden="true"><img id="pimg" alt=""><span id="plab"></span></div></div>

  <div class="cta">
    <a class="btn" href="https://sites.smartlabdesign.it" target="_blank" rel="noopener">See the work ↗</a>
    <a class="btn alt" href="https://www.linkedin.com/in/alessio-talluto/" target="_blank" rel="noopener">LinkedIn ↗</a>
    <button class="btn alt" id="copy" type="button">Copy email</button>
  </div>

  <footer>
    <span class="credit">Ideas into worlds by <b>SmartLabDesign</b></span>
    <nav><a href="https://sites.smartlabdesign.it" target="_blank" rel="noopener">Studio ↗</a><a href="https://www.linkedin.com/in/alessio-talluto/" target="_blank" rel="noopener">LinkedIn ↗</a><span class="credit">Set in Archivo Black ✦ Barlow Condensed</span></nav>
  </footer>
</div>
<div class="loader" id="loader">Setting up the book</div>
<p class="sr" aria-live="polite" id="live"></p>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(async () => {
const I='#062d31',C='#fff0ce',P='#f7ddad',CO='#ff6848',PK='#ff2d87',AQ='#00bfc4',SU='#ffbc42';
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const W=1, H=0.98, PW=1024, PH=Math.round(1024*H), RAD=74, GAP=0.0034, SEG=56;

try{ await Promise.race([Promise.all(['400 100px "Archivo Black"','800 40px "Barlow Condensed"','600 40px "Barlow Condensed"','500 20px "DM Mono"'].map(f=>document.fonts.load(f))), new Promise(r=>setTimeout(r,3500))]); }catch(e){}

/* ---------- canvas helpers ---------- */
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
const LS=(x,v)=>{ if('letterSpacing' in x) x.letterSpacing=v; };
function wrap(x,text,maxW){const words=text.split(' ');const lines=[];let l='';for(const w of words){const t=l?l+' '+w:w;if(x.measureText(t).width>maxW&&l){lines.push(l);l=w}else l=t}if(l)lines.push(l);return lines}
function grain(x,w,h,a=.05){for(let i=0;i<w*h/90;i++){x.fillStyle=Math.random()<.5?`rgba(0,0,0,${a})`:`rgba(255,255,255,${a*.8})`;x.fillRect(Math.random()*w,Math.random()*h,1.6,1.6)}}
function star(x,cx,cy,r,ri){x.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4-Math.PI/2,rr=i%2?ri:r;x.lineTo(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr)}x.closePath()}

function bigWord(x,word,cx,cy,maxW,maxH,{fill,sh,ol},rot=-0.04){
  x.save();x.translate(cx,cy);x.rotate(rot);
  let fs=400;x.font=`400 ${fs}px "Archivo Black"`;LS(x,`${-fs*.045}px`);
  const m=x.measureText(word).width;fs=Math.min(fs*maxW/m,maxH);x.font=`400 ${fs}px "Archivo Black"`;LS(x,`${-fs*.045}px`);
  x.textAlign='center';x.textBaseline='middle';
  const o=fs*.06;
  x.lineJoin='round';x.strokeStyle=ol;x.lineWidth=fs*.022;x.strokeText(word,o*2.2,o*2.4);
  x.fillStyle=sh;x.fillText(word,o,o*1.1);
  x.fillStyle=fill;x.fillText(word,0,0);
  x.restore();
}
function block(x,o){
  let {x0,y,w,col}=o; x.textAlign='left';x.textBaseline='alphabetic';
  x.fillStyle=col;x.globalAlpha=.75;x.font='500 21px "DM Mono"';LS(x,'3px');x.fillText(o.kicker.toUpperCase(),x0,y);x.globalAlpha=1;y+=58;
  x.font='800 54px "Barlow Condensed"';LS(x,'0px');
  for(const l of wrap(x,o.title.toUpperCase(),w)){x.fillText(l,x0,y);y+=52} y+=10;
  x.font='600 29px "Barlow Condensed"';
  for(const l of wrap(x,o.body,w)){x.fillText(l,x0,y);y+=36} y+=18;
  if(o.tip){
    x.font='600 27px "Barlow Condensed"';const tl=wrap(x,o.tip,w-60);const bh=64+tl.length*33;
    x.fillStyle=o.tipSh;x.beginPath();x.roundRect(x0+12,y+12,w,bh,[6,38,6,38]);x.fill();
    x.fillStyle=o.tipBg;x.strokeStyle=I;x.lineWidth=4;x.beginPath();x.roundRect(x0,y,w,bh,[6,38,6,38]);x.fill();x.stroke();
    x.fillStyle=o.tipFg;x.font='500 17px "DM Mono"';LS(x,'3px');x.fillText('TRY THIS',x0+30,y+36);LS(x,'0px');
    x.font='600 27px "Barlow Condensed"';tl.forEach((l,i)=>x.fillText(l,x0+30,y+72+i*33));
  }
  if(o.lines){x.font='500 22px "DM Mono"';LS(x,'1px');o.lines.forEach((l,i)=>{x.fillStyle=i%2?C:SU;x.fillText(l,x0,y+i*38)})}
}

/* ---------- motifs (left page area) ---------- */
const M={
  listen(x){x.lineCap='round';[110,190,90,240,150,280,120,200,80].forEach((h,i)=>{const bx=200+i*62,by=780;x.fillStyle=PK;x.fillRect(bx+10,by-h/2+10,36,h);x.fillStyle=AQ;x.fillRect(bx,by-h/2,36,h)});
    x.strokeStyle=SU;x.lineWidth=12;[70,120,170].forEach(r=>{x.beginPath();x.arc(820,780,r,-.9,.9);x.stroke()})},
  idea(x){x.fillStyle=C;for(let i=0;i<40;i++){x.beginPath();x.arc(120+(i*137)%820,560+(i*89)%400,3+(i%3)*2,0,7);x.fill()}
    star(x,520+18,760+18,230,70);x.fillStyle=I;x.fill();star(x,520,760,230,70);x.fillStyle=SU;x.fill();x.strokeStyle=I;x.lineWidth=10;x.stroke();
    x.fillStyle=C;x.beginPath();x.arc(520,760,26,0,7);x.fill()},
  borrow(x){x.strokeStyle=I;x.lineWidth=12;x.lineCap='round';for(let i=0;i<12;i++){const a=i*Math.PI/6;x.beginPath();x.moveTo(340+Math.cos(a)*150,700+Math.sin(a)*150);x.lineTo(340+Math.cos(a)*190,700+Math.sin(a)*190);x.stroke()}
    x.fillStyle=CO;x.beginPath();x.arc(340,700,120,0,7);x.fill();x.stroke();
    x.save();x.translate(640,800);x.rotate(-.7);x.fillStyle=I;x.fillRect(-18,120,36,170);x.fillStyle=PK;x.beginPath();x.arc(14,14,135,0,7);x.fill();
    x.fillStyle='rgba(255,240,206,.55)';x.beginPath();x.arc(0,0,135,0,7);x.fill();x.lineWidth=22;x.stroke();x.restore()},
  sketch(x){x.strokeStyle=I;x.lineWidth=10;x.lineCap='round';x.setLineDash([4,26]);x.beginPath();x.moveTo(140,820);
    for(let i=0;i<8;i++)x.quadraticCurveTo(190+i*90,i%2?660:960,240+i*90,820);x.stroke();x.setLineDash([]);
    x.save();x.translate(560,690);x.rotate(.55);x.fillStyle=PK;x.fillRect(-160+12,-36+12,330,72);x.fillStyle=C;x.strokeStyle=I;x.lineWidth=8;
    x.fillRect(-160,-36,280,72);x.strokeRect(-160,-36,280,72);x.fillStyle=CO;x.fillRect(120,-36,50,72);x.strokeRect(120,-36,50,72);
    x.fillStyle=P;x.beginPath();x.moveTo(-160,-36);x.lineTo(-230,0);x.lineTo(-160,36);x.closePath();x.fill();x.stroke();
    x.fillStyle=I;x.beginPath();x.moveTo(-205,-12);x.lineTo(-230,0);x.lineTo(-205,12);x.fill();x.restore()},
  system(x){const s=[[CO,'c'],[AQ,'s'],[SU,'t'],[PK,'x']];s.forEach(([c,k],i)=>{const bx=190+(i%2)*230,by=560+Math.floor(i/2)*230;
    x.fillStyle=C;x.fillRect(bx+12,by+12,190,190);x.fillStyle=c;x.fillRect(bx,by,190,190);x.fillStyle=I;const cx=bx+95,cy=by+95;
    if(k==='c'){x.beginPath();x.arc(cx,cy,52,0,7);x.fill()}else if(k==='s')x.fillRect(cx-48,cy-48,96,96);else if(k==='t'){x.beginPath();x.moveTo(cx,cy-56);x.lineTo(cx+56,cy+46);x.lineTo(cx-56,cy+46);x.fill()}else{star(x,cx,cy,60,18);x.fill()}})},
  move(x){x.strokeStyle=I;x.lineWidth=12;x.lineCap='round';[[120,720,330],[170,790,380],[110,860,300]].forEach(([a,b,c])=>{x.beginPath();x.moveTo(a,b);x.lineTo(c,b);x.stroke()});
    [[380,'rgba(255,240,206,.35)',46],[470,'rgba(255,240,206,.6)',62]].forEach(([cx,c,r])=>{x.fillStyle=c;x.beginPath();x.arc(cx,790,r,0,7);x.fill()});
    x.fillStyle=I;x.beginPath();x.arc(640+16,790+16,110,0,7);x.fill();x.fillStyle=SU;x.beginPath();x.arc(640,790,110,0,7);x.fill();x.lineWidth=10;x.stroke();
    x.strokeStyle=C;x.lineWidth=14;x.beginPath();x.arc(640,790,68,3.6,4.6);x.stroke()},
  test(x){const eye=(ox,oy)=>{x.beginPath();x.moveTo(150+ox,770+oy);x.quadraticCurveTo(510+ox,510+oy,870+ox,770+oy);x.quadraticCurveTo(510+ox,1030+oy,150+ox,770+oy);x.closePath()};
    eye(16,16);x.fillStyle=I;x.fill();eye(0,0);x.fillStyle=C;x.fill();x.strokeStyle=I;x.lineWidth=10;x.stroke();
    x.fillStyle=AQ;x.beginPath();x.arc(510,770,125,0,7);x.fill();x.stroke();x.fillStyle=I;x.beginPath();x.arc(510,770,58,0,7);x.fill();
    x.fillStyle=C;x.beginPath();x.arc(540,740,20,0,7);x.fill()},
  worlds(x){x.fillStyle='rgba(255,45,135,.25)';x.beginPath();x.arc(500,760,250,0,7);x.fill();
    x.fillStyle=CO;x.strokeStyle=C;x.lineWidth=8;x.beginPath();x.arc(500,760,160,0,7);x.fill();x.stroke();
    x.strokeStyle=I;x.lineWidth=14;x.lineCap='round';x.beginPath();x.moveTo(380,720);x.quadraticCurveTo(470,670,600,710);x.stroke();x.beginPath();x.moveTo(400,820);x.quadraticCurveTo(480,850,560,830);x.stroke();
    x.save();x.translate(500,760);x.rotate(-.28);x.strokeStyle=SU;x.lineWidth=16;x.beginPath();x.ellipse(0,0,290,62,0,0,7);x.stroke();x.restore();
    [[170,590,SU],[860,620,AQ],[840,930,C],[180,940,PK]].forEach(([a,b,c])=>{star(x,a,b,30,9);x.fillStyle=c;x.fill()})}
};

/* ---------- spreads ---------- */
const RULES=[
 {k:'listen',word:'LISTEN',bg:I,fill:C,sh:PK,ol:AQ,col:C,tipBg:SU,tipFg:I,tipSh:PK,title:'Listen before you draw.',body:'Every brand already carries a story. The first job is to hear it clearly, in the client’s own words, before a single line goes on the page.',tip:'Record the first meeting and write down the five words the client repeats most.'},
 {k:'idea',word:'ONE IDEA',bg:CO,fill:C,sh:I,ol:SU,col:I,tipBg:C,tipFg:I,tipSh:I,title:'Find the one idea.',body:'A project can hold many ideas, but only one can lead. Name it in a sentence. If it needs a paragraph, keep cutting.',tip:'Write the idea on a sticky note. If it doesn’t fit, it isn’t one idea yet.'},
 {k:'borrow',word:'BORROW',bg:AQ,fill:SU,sh:I,ol:PK,col:I,tipBg:C,tipFg:I,tipSh:PK,title:'Borrow the light, not the work.',body:'Look at everything: films, streets, old packaging, other studios. Take the feeling home and leave the artwork where you found it.',tip:'Build a moodboard, then close it before you open the design file.'},
 {k:'sketch',word:'SKETCH',bg:SU,fill:I,sh:PK,ol:CO,col:I,tipBg:C,tipFg:I,tipSh:PK,title:'Sketch rough, finish sharp.',body:'Early drafts are allowed to be ugly. Fast and loose finds the shape. Precision comes later, on a grid, at full size.',tip:'Ten minutes and a marker for the first twenty thumbnails. No erasing.'},
 {k:'system',word:'SYSTEMS',bg:I,fill:SU,sh:CO,ol:AQ,col:C,tipBg:AQ,tipFg:I,tipSh:PK,title:'Design the system, not the poster.',body:'One great image is a moment. Colour, type, spacing and voice that hold up everywhere make a brand.',tip:'Put the logo, a social post and an invoice side by side. Do they look related?'},
 {k:'move',word:'MOVE',bg:PK,fill:C,sh:I,ol:SU,col:I,tipBg:C,tipFg:I,tipSh:I,title:'Make it move.',body:'People remember what changes. A considered transition can explain more than a paragraph of copy.',tip:'Remove every animation, then add back only the ones you miss.'},

/* ---------- flipping ---------- */
function flipTo(target){
  if(target===cur||target<0||target>NL-1)return;
  unsettle();const from=cur;cur=target;busy=true;const tok=++flipToken;leaves.forEach(deform);
  const ks=target>from?[...Array(target-from)].map((_,k)=>from+k):[...Array(from-target)].map((_,k)=>from-1-k);
  let end=0;
  ks.forEach((k,n)=>{const L=leaves[k];L.dir=target>from?1:-1;const to=target>from?1:0,dur=RM?0:Math.max(.4,1.15*Math.abs(to-L.t)),del=RM?0:n*.12;end=Math.max(end,dur+del);
    gsap.to(L,{t:to,duration:dur,delay:del,ease:'power2.inOut',overwrite:true,onUpdate(){deform(L)},onComplete(){deform(L)}})});
  setThick();ui();
  setTimeout(()=>{if(tok!==flipToken)return;busy=false;settle()},end*1000+40);
}

addEventListener('pointermove',e=>{

  if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)){dx<0?next():prev();return}
  if(Math.abs(dx)<8&&Math.abs(dy)<8){if(cur===0)next();else(e.clientX>innerWidth/2?next():prev())}
});
canvas.addEventListener('pointerleave',()=>{if(!drag&&cur===0)setPeel(false)});

/* ---------- nav: dock magnifier + section preview ---------- */
const dots=document.getElementById('dots'),pv=document.getElementById('preview'),pimg=document.getElementById('pimg'),plab=document.getElementById('plab');
const thumbs=spreadCanvases.map(c=>{const t=mk(424,208),x=t.getContext('2d');x.drawImage(c,0,0,424,208);return t.toDataURL('image/jpeg',.82)});
spreadCanvases.length=0;
const dotEls=SPREADS.map((s,j)=>{const b=document.createElement('button');b.className='dot';b.type='button';b.style.setProperty('--c',s.bg);
  b.setAttribute('aria-label',`Go to ${names[j+1]}`);b.innerHTML='<i></i>';b.onclick=()=>goSpread(j);
  const show=()=>{pimg.src=thumbs[j];plab.textContent=names[j+1];pv.style.left=(b.offsetLeft+b.offsetWidth/2)+'px';pv.classList.add('on')};
  b.addEventListener('pointerenter',show);b.addEventListener('focus',show);b.addEventListener('blur',()=>pv.classList.remove('on'));
  dots.appendChild(b);return b});
dots.addEventListener('pointermove',e=>{dotEls.forEach(b=>{const r=b.getBoundingClientRect(),d=Math.abs(e.clientX-(r.left+r.width/2)),s=1+1.25*Math.max(0,1-d/105);
  b.style.transform=`translateY(${-(s-1)*12}px) scale(${s})`})});
dots.addEventListener('pointerleave',()=>{dotEls.forEach(b=>b.style.transform='');pv.classList.remove('on')});

function ui(){
  document.body.classList.toggle('is-open',cur>0);
  const end=cur===NL-1&&(!portrait()||side==='R');
  document.body.classList.toggle('at-end',end);
  dotEls.forEach((d,j)=>d.setAttribute('aria-current',String(j===cur-1)));
  document.getElementById('next').disabled=end;
  document.getElementById('live').textContent=names[cur];
}
document.getElementById('open').onclick=next;
document.getElementById('next').onclick=next;
document.getElementById('prev').onclick=prev;
document.getElementById('home').onclick=close;
addEventListener('keydown',e=>{if(e.key==='ArrowRight')next();else if(e.key==='ArrowLeft')prev();else if(e.key==='Escape')close()});
let wl=0;addEventListener('wheel',e=>{const now=Date.now();if(now-wl<1100||Math.abs(e.deltaY)<25)return;wl=now;e.deltaY>0?next():prev()},{passive:true});
const copy=document.getElementById('copy');
copy.onclick=()=>{const t='jamez.ichat@gmail.com',done=m=>{copy.textContent=m;setTimeout(()=>copy.textContent='Copy email',1800)};
  try{navigator.clipboard.writeText(t).then(()=>done('Copied'),()=>done(t))}catch(_){done(t)}};

/* ---------- boot + loop ---------- */
resize();thick.r=TOP-PG*1.5;applyThick();
Object.assign(proxy,view());const v0=view();proxy.py*=1.35;proxy.pz*=1.35;proxy.ry=0.6;
gsap.to(proxy,{...v0,duration:RM?0:2.2,ease:'power3.out',delay:.2});
ui();
let tm=0;
renderer.setAnimationLoop(()=>{
  tm+=0.016;applyProxy();
  const k=RM?0:1;
  tilt.x+=(ptr.x-tilt.x)*.06;tilt.y+=(ptr.y-tilt.y)*.06;
  const amt=cur===0?1:.55;
  book.rotation.set(tilt.y*.10*amt*k,proxy.ry+(cur===0?tilt.x*.12*k:0),-tilt.x*.07*amt*k);
  layers.forEach(l=>{l.mesh.position.x=tilt.x*.035*l.d*k;l.mesh.position.z=tilt.y*.028*l.d*k+(l.k?Math.sin(tm*1.4)*.004*k:0)});
  dl.position.set(-1.6+tilt.x*1.2,3,1.4+tilt.y*1.2);
  renderer.render(scene,cam);
});
document.getElementById('loader').classList.add('done');
})();
</script>
