<div id="lblsw" style="position:fixed;z-index:50;right:16px;top:16px;display:flex;gap:6px;font:600 11px/1 system-ui;letter-spacing:.12em"><button data-l="a">A · TAG</button><button data-l="c">C · LINE</button></div>
<script>(()=>{const s=document.querySelector('#vsr'),q=new URLSearchParams(location.search).get('label');if(q==='a'||q==='c')s.dataset.label=q;const bs=[...document.querySelectorAll('#lblsw button')];const sync=()=>bs.forEach(b=>{const on=b.dataset.l===s.dataset.label;b.style.cssText='padding:9px 12px;border-radius:999px;cursor:pointer;border:1px solid #ff4a3d;color:'+(on?'#000':'#ff4a3d')+';background:'+(on?'#ff4a3d':'rgba(0,0,0,.6)')});bs.forEach(b=>b.onclick=()=>{s.dataset.label=b.dataset.l;sync();requestAnimationFrame(()=>window.VSRack?.relayout?.())});sync()})()</script>
