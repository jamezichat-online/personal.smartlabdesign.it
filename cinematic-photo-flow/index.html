<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Disponi le tue foto e attraversa la sequenza con lo scroll.">
<title>Cinematic Photo Flow</title>
<link rel="stylesheet" href="style.css?v=1650f76770a5">
<script src="app.js?v=f90442c98015" defer></script>
</head>
<body>
<header class="bar">
  <div class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span><h1>Cinematic Photo Flow</h1></div>
  <button class="button outline" id="mode"><span class="view-icon" aria-hidden="true"></span><span id="mode-label">Modalità visione</span></button>
</header>
<main>
  <section class="viewport" id="viewport" aria-label="Sequenza fotografica" tabindex="0">
    <div class="track" id="track">
      <div class="stage" id="stage">
        <div class="scene" id="scene" aria-hidden="true">
          <div class="optical-glow" id="optical-glow"></div>
          <div class="film-surface" id="film-surface"></div>
          <canvas class="dust-plane dust-far" id="dust-far"></canvas>
          <canvas class="dust-plane dust-mid" id="dust-mid"></canvas>
          <canvas class="dust-plane dust-near" id="dust-near"></canvas>
        </div>
        <div class="vignette" aria-hidden="true"></div>
        <div class="stage-top"><span id="source-label">Galleria demo</span><span id="counter"></span></div>
        <div class="stage-bottom"><button class="scroll-cta" id="cta" type="button" role="progressbar" aria-label="Avanzamento della sequenza" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span class="scroll-cta__layer scroll-cta__base"><i class="scroll-cta__icon"></i><span class="scroll-cta__labels"><span class="l-idle">Scorri per esplorare</span><span class="l-done">Torna all'inizio ↑</span></span></span><span class="scroll-cta__layer scroll-cta__fill" aria-hidden="true"><i class="scroll-cta__icon"></i><span class="scroll-cta__labels"><span class="l-idle">Scorri per esplorare</span><span class="l-done">Torna all'inizio ↑</span></span></span></button></div>
        <div class="empty" id="empty" hidden><p>La tua sequenza inizia con una foto.</p><button class="button accent" id="empty-upload">Carica immagini</button></div>
      </div>
    </div>
  </section>
  <section class="editor" id="editor" aria-labelledby="editor-title">
    <div class="editor-head">
      <div><h2 id="editor-title">Sequenza</h2><p id="edit-help">Seleziona una miniatura per raggiungere la foto.</p></div>
      <div class="editor-actions"><span id="save-state" role="status"></span><button class="button outline" id="new-gallery" hidden>Nuova galleria</button><button class="button accent" id="upload"><span aria-hidden="true">＋</span> Carica immagini</button></div>
    </div>
    <div class="upload-area" id="upload-area" aria-label="Miniature della sequenza"><ol id="strip"></ol></div>
    <div id="image-actions" class="image-actions" hidden>
      <span id="selected-name"></span>
      <button class="button quiet" id="replace">Sostituisci</button>
      <button class="button quiet" id="focal">Punto focale</button>
      <button class="button quiet remove" id="remove">Rimuovi</button>
    </div>
  </section>
</main>
<dialog id="focal-dialog">
  <form method="dialog">
    <div class="dialog-head"><h2>Punto focale</h2><button class="button quiet" value="cancel" aria-label="Chiudi">✕</button></div>
    <p>Scegli il punto da mantenere visibile nei ritagli.</p>
    <div class="focal-image"><img id="focal-image" alt=""><span id="focal-marker" aria-hidden="true"></span></div>
    <label>Orizzontale <input id="focal-x" type="range" min="0" max="100"></label>
    <label>Verticale <input id="focal-y" type="range" min="0" max="100"></label>
    <div class="dialog-foot"><button class="button outline" value="cancel">Annulla</button><button class="button accent" value="save">Salva punto</button></div>
  </form>
</dialog>
<input type="file" id="files" accept="image/jpeg,image/png,image/webp,image/avif,image/gif,image/heic,image/heif" multiple hidden>
<div class="sr-only" id="live" aria-live="polite"></div>
</body>
</html>
