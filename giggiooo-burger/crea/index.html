<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1c0c08" />
    <meta name="description" content="Crea il tuo Giggiooo: scegli pane, carne, formaggi, extra e salse e guarda il tuo burger prendere forma, strato dopo strato." />
    <title>Crea il tuo — Giggiooo Burger</title>
    <link rel="icon" href="../assets/favicon-v2.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" />
    <link rel="stylesheet" href="crea.css?v=20261023" />
    <script src="art.js?v=20261023b" defer></script>
    <script src="crea.js?v=20261023" defer></script>
    <script defer src="https://smartlab-analytics.smartlabdesign-tools.workers.dev/tracker.js" referrerpolicy="no-referrer"></script>
  </head>
  <body>
    <header class="crea-header">
      <a class="back" href="../#menu" aria-label="Torna a Giggiooo Burger"><span aria-hidden="true">←</span> MENU</a>
      <a class="crea-brand" href="../" aria-label="Giggiooo Burger, home"><img src="../assets/giggiooo-logo-v2.png" alt="Giggiooo Burger" width="700" height="496" /></a>
      <span class="crea-tag">CREA IL TUO</span>
    </header>

    <main class="crea-main">
      <section class="stage" aria-label="Anteprima del tuo burger">
        <div class="stage-glow" aria-hidden="true"></div>
        <div class="stage-grain" aria-hidden="true"></div>
        <div class="stack-fit">
          <div class="stack-zoom">
            <div class="paper" aria-hidden="true"></div>
            <div class="flag" aria-hidden="true"><div class="flag-inner"><span class="stick"></span><span class="pennant"><img src="../assets/giggiooo-logo-v2.png" alt="" /></span></div></div>
          </div>
        </div>
        <canvas class="smoke" aria-hidden="true"></canvas>
        <p class="stage-status"></p>
      </section>

      <section class="panel" aria-label="Configura il burger">
        <div class="panel-head">
          <span class="kicker">03 / CREA IL TUO</span>
          <h1>Il tuo<br /><em>Giggiooo.</em></h1>
          <p>Strato dopo strato, esattamente come lo vuoi tu.</p>
        </div>

        <div class="presets">
          <span class="label">PARTI DA UN CLASSICO</span>
          <div class="preset-row">
            <button type="button" class="preset" data-preset="originale" aria-pressed="false">L'Originale</button>
            <button type="button" class="preset" data-preset="fume" aria-pressed="false">Il Fumé</button>
            <button type="button" class="preset" data-preset="dorato" aria-pressed="false">Il Dorato</button>
            <button type="button" class="preset" data-preset="bosco" aria-pressed="false">Il Bosco</button>
            <button type="button" class="btn-reset">Da zero <span aria-hidden="true">↺</span></button>
          </div>
        </div>

        <div class="tabs" role="tablist" aria-label="Categorie di ingredienti"></div>
        <div class="chips" id="chips" role="tabpanel"></div>

        <div class="summary">
          <dl class="stats">
            <div><dt>Totale</dt><dd data-stat="price">—</dd></div>
            <div><dt>Energia</dt><dd data-stat="kcal">—</dd></div>
            <div><dt>Altezza</dt><dd data-stat="layers">—</dd></div>
          </dl>
          <div class="allergen-row"><span class="label">ALLERGENI</span><ul class="allergens"></ul></div>
        </div>

        <div class="done-panel">
          <span class="label">DAGLI UN NOME</span>
          <input id="burger-name" type="text" maxlength="28" placeholder="Il mio Giggiooo" autocomplete="off" />
          <div class="done-actions">
            <button type="button" class="btn-card">Scarica la card <span aria-hidden="true">↓</span></button>
            <button type="button" class="btn-edit">Modifica <span aria-hidden="true">↺</span></button>
          </div>
        </div>

        <p class="fine">Prototipo. Prezzi, calorie e allergeni a scopo dimostrativo.</p>
      </section>
    </main>

    <div class="cta-bar">
      <span class="delta" aria-hidden="true"></span>
      <button type="button" class="cta"><span class="cta-label">Griglia e chiudi</span><span class="cta-price">—</span></button>
    </div>
    <div class="sr-live" aria-live="polite"></div>
  </body>
</html>
