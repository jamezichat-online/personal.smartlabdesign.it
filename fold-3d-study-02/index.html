<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>FOLD 3D / STUDY 02</title><link rel="stylesheet" href="style.css?v=18"></head><body class="cinematic"><header><h1>FOLD <span>3D</span><small>/ STUDY 02</small></h1></header><main id="stage"><canvas id="view" tabindex="0" aria-label="Dispositivo 3D. Trascina per ruotare, usa la rotella per zoomare. Frecce per ruotare, più e meno per zoomare."></canvas><div id="loading" role="status">Preparazione del dispositivo…</div><div class="stage-meta"><span>ESPLORA NELLO SPAZIO</span><span id="angle">126°</span></div></main><footer><div class="panel-handle"><button id="controls-toggle" aria-expanded="true" aria-controls="control-panel">Nascondi controlli ⌄</button></div><div id="control-panel"><div class="panel-tools"><div class="finish-switch" role="group" aria-label="Colore della scocca"><button class="finish active" data-finish="titanium" aria-pressed="true"><i class="titanium-swatch"></i>Titanio lucido</button><button class="finish" data-finish="midnight" aria-pressed="false"><i class="midnight-swatch"></i>Blu mezzanotte</button></div><button id="upload-image">Cambia immagine</button><input id="image-file" type="file" accept="image/jpeg,image/png,image/webp,image/avif" hidden></div><div class="controls"><button id="toggle" class="primary">Chiudi dispositivo ↙</button><label class="range">Apertura<input id="fold" type="range" min="0" max="1000" value="700"><output id="percent">70%</output></label><label class="range light-range">Luce ambientale<input id="light" type="range" min="0" max="250" step="1" value="100"><output id="light-value" for="light">100%</output></label><button id="cinema" aria-pressed="true">Luce cinematografica</button><button id="reset">Vista frontale</button><button id="float" aria-pressed="true">Fluttuazione</button><button id="slow" aria-pressed="false">¼ velocità</button></div><p>Trascina per ruotare · Rotella o pinch per zoomare · Tasto destro o due dita per spostare</p><div id="image-status" role="status" aria-live="polite"></div></div></footer><script type="module" src="app.reveal-21.js"></script></body></html>
