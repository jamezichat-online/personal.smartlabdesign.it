<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Aurelia Bay</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&family=Tenor+Sans&display=swap">
<style>
/* Layout: full-bleed real-time 3D stage; matte-black glass HUD floats on the edges, unit sheet slides in from the right */
:root{
  --ink:#09080d; --ink-2:#13111b;
  --glass:rgba(16,14,24,.56); --glass-hi:rgba(18,16,27,.86);
  --line:rgba(232,226,255,.12); --line-hi:rgba(232,226,255,.26);
  --fg:#f3f0fa; --muted:#aba5be; --dim:#77718b;
  --accent:#bba6ff; --accent-deep:#7b5cff; --glow:rgba(140,110,255,.45);
  --avail:#3db2ff; --hold:#f3b443; --sold:#ff5469;
  --on-accent:#140f24;
  --f-display:"Tenor Sans","Didot","Bodoni 72",Georgia,serif;
  --f-body:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --gl:max(16px, env(safe-area-inset-left,0px));
  --gr:max(16px, env(safe-area-inset-right,0px));
  --top:calc(env(safe-area-inset-top,0px) + 14px);
  --bot:calc(env(safe-area-inset-bottom,0px) + 14px);
  --r:16px;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45;overflow:hidden;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none;cursor:grab}
#scene:active{cursor:grabbing}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%);
  border:1px solid var(--line);border-radius:var(--r);box-shadow:0 18px 50px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.06)}
button,select,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mono{font-family:var(--f-data);font-variant-numeric:tabular-nums}
.eyebrow{margin:0;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.02em}

/* brand */
.brand{position:fixed;z-index:5;top:var(--top);left:var(--gl);padding:12px 18px 11px;display:flex;flex-direction:column;gap:3px}
.brand b{font-family:var(--f-display);font-weight:400;font-size:21px;letter-spacing:.34em;line-height:1}
.brand span{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}

/* tools */
.tools{position:fixed;z-index:5;top:var(--top);right:var(--gr);display:flex;gap:8px;align-items:center}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--fg)}
.iconbtn.sm{width:32px;height:32px;border-radius:10px}
.iconbtn:hover{background:rgba(255,255,255,.07)}
.iconbtn.on{color:var(--sold)} .iconbtn.on .ic{fill:currentColor}
.compass{width:52px;height:52px;border-radius:50%;display:grid;place-items:center}
.compass svg{width:40px;height:40px}
.compass text{font-family:var(--f-data);font-size:8px;fill:var(--fg)}

/* time HUD */
.hud{position:fixed;z-index:6;top:var(--top);left:50%;transform:translateX(-50%);width:min(700px, calc(100vw - 760px));min-width:470px;
  display:grid;grid-template-columns:auto 1fr auto;gap:8px 14px;align-items:center;padding:10px 14px 10px 10px}
.presets{display:flex;gap:2px}
.presets button{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.presets button:hover,.presets button[aria-pressed="true"]{color:var(--fg);background:rgba(255,255,255,.08)}
.slider{position:relative;min-width:0}
.slider input{width:100%;margin:0;-webkit-appearance:none;appearance:none;height:28px;background:transparent;cursor:pointer}
.slider input::-webkit-slider-runnable-track{height:6px;border-radius:6px;background:var(--track,linear-gradient(90deg,#1b2347,#cfe3ff,#1b2347))}
.slider input::-moz-range-track{height:6px;border-radius:6px;background:var(--track,linear-gradient(90deg,#1b2347,#cfe3ff,#1b2347))}
.slider input::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;margin-top:-6px;border-radius:50%;background:#fff;border:3px solid var(--ink);box-shadow:0 0 0 1px rgba(255,255,255,.5),0 0 18px rgba(255,220,170,.9)}
.slider input::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--ink);box-shadow:0 0 0 1px rgba(255,255,255,.5),0 0 18px rgba(255,220,170,.9)}
.ticks{display:flex;justify-content:space-between;font-family:var(--f-data);font-size:9.5px;color:var(--dim);padding:0 2px;margin-top:-3px}
.clock{font-family:var(--f-data);font-size:22px;font-weight:500;letter-spacing:.02em;min-width:66px;text-align:right}
.hud-row{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:6px 4px 0;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.hud-row .sp{flex:1}
.hud-row .mono{font-size:11.5px}
select{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:9px;padding:5px 8px;font-size:12px}
select option{background:var(--ink-2)}
.seg{display:flex;padding:2px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.seg button{padding:4px 10px;border-radius:8px;font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.seg button .ic{width:14px;height:14px}
.seg button[aria-pressed="true"]{background:rgba(187,166,255,.18);color:var(--fg)}

/* nav */
.nav{position:fixed;z-index:6;bottom:var(--bot);left:50%;transform:translateX(-50%);display:flex;gap:4px;padding:6px;border-radius:999px;max-width:calc(100vw - 32px);overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{display:flex;align-items:center;gap:8px;padding:11px 17px;border-radius:999px;color:var(--muted);white-space:nowrap;font-weight:600;font-size:13px;letter-spacing:.01em;transition:color .2s,background .2s}
.nav button:hover{color:var(--fg)}
.nav button[aria-pressed="true"]{background:rgba(187,166,255,.15);color:var(--fg);box-shadow:inset 0 0 0 1px rgba(187,166,255,.38),0 0 26px var(--glow)}
.badge{font-family:var(--f-data);font-size:10.5px;background:var(--accent);color:var(--on-accent);border-radius:999px;padding:1px 6px;font-weight:500}

/* pins */
#pins{position:fixed;inset:0;pointer-events:none;z-index:3}
.pin{position:absolute;left:0;top:0;pointer-events:auto;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:center;padding:8px 14px 9px 8px;border-radius:14px;
  background:var(--glass-hi);border:1px solid var(--line-hi);box-shadow:0 10px 30px rgba(0,0,0,.4);text-align:left;transition:opacity .3s}
.pin::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:26px;background:linear-gradient(var(--accent),transparent)}
.pin:hover{border-color:var(--accent)}
.pin-id{grid-row:1/3;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-family:var(--f-display);font-size:16px;background:rgba(187,166,255,.16);color:var(--accent)}
.pin b{font-weight:600;font-size:13px;white-space:nowrap}
.pin small{font-size:11px;color:var(--muted);white-space:nowrap}
.pin-bar{grid-column:1/-1;display:flex;height:3px;border-radius:3px;overflow:hidden;margin-top:6px;background:rgba(255,255,255,.08)}
.pin-bar i{display:block;height:100%}
.poi{padding:7px 11px 8px;grid-template-columns:auto 1fr}
.poi .pin-id{width:24px;height:24px;font-size:12px;font-family:var(--f-data)}
.poi.site .pin-id{background:var(--accent);color:var(--on-accent)}
.ringlabel{position:absolute;left:0;top:0;font-family:var(--f-data);font-size:10px;color:var(--accent);letter-spacing:.06em;text-shadow:0 1px 6px rgba(0,0,0,.8)}

/* legend */
.legend{position:fixed;z-index:5;left:var(--gl);top:calc(var(--top) + 78px);padding:14px 16px;width:224px;display:flex;flex-direction:column;gap:10px}
.legend h3{font-size:19px}
.legend ul{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.legend li{display:flex;align-items:center;gap:10px;font-size:13px}
.legend li b{margin-left:auto;font-family:var(--f-data);font-weight:500}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.dot.avail{background:var(--avail);box-shadow:0 0 10px var(--avail)}
.dot.hold{background:var(--hold);box-shadow:0 0 10px var(--hold)}
.dot.sold{background:var(--sold);box-shadow:0 0 10px var(--sold)}
.legend .hint{margin:0;font-size:11.5px;color:var(--muted)}
.tswitch{display:flex;gap:6px}
.tswitch button{flex:1;padding:7px 0;border-radius:9px;border:1px solid var(--line);font-family:var(--f-display);font-size:14px;color:var(--muted)}
.tswitch button[aria-pressed="true"]{border-color:var(--accent);color:var(--fg);background:rgba(187,166,255,.12)}

/* leader + card */
#leaders{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:6;overflow:visible}
#leaderPath{fill:none;stroke:var(--accent);stroke-width:1.4;filter:drop-shadow(0 0 4px var(--glow))}
#leaderDot{fill:var(--accent)}
#leaderRing{fill:none;stroke:var(--accent);stroke-width:1.2;transform-box:fill-box;transform-origin:center;animation:ring 1.8s ease-out infinite}
@keyframes ring{from{transform:scale(.4);opacity:1}to{transform:scale(1.6);opacity:0}}
.card{position:fixed;z-index:7;left:0;top:0;width:300px;padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--glass-hi);animation:pop .35s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;scale:.94}to{opacity:1;scale:1}}
.card-head{display:flex;align-items:center;justify-content:space-between}
.card-tools{display:flex;gap:2px}
.card-main{display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:center}
.card-plan{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:10px;padding:6px;aspect-ratio:1/1;max-width:100%}
.card-plan svg{width:100%;height:100%;display:block}
.code{font-size:26px;margin:0;letter-spacing:.02em}
.sub{margin:2px 0 0;font-size:12px;color:var(--muted)}
.card-kv{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 0;font-size:11px;color:var(--muted)}
.card-kv span{display:flex;flex-direction:column}
.card-kv b{font-family:var(--f-data);font-weight:500;font-size:14px;color:var(--fg)}
.card-price{font-family:var(--f-display);font-size:24px;letter-spacing:.02em}
.card-price small{font-family:var(--f-body);font-size:11px;color:var(--muted);margin-left:6px;letter-spacing:0}
.card-actions{display:grid;grid-template-columns:1fr 1fr auto;gap:8px}
.card.docked{left:var(--gl)!important;right:var(--gr);top:auto!important;bottom:calc(var(--bot) + 70px);width:auto;transform:none!important}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.04em;border:1px solid}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.avail{color:var(--avail);border-color:rgba(61,178,255,.4);background:rgba(61,178,255,.1)}
.pill.hold{color:var(--hold);border-color:rgba(243,180,67,.4);background:rgba(243,180,67,.1)}
.pill.sold{color:var(--sold);border-color:rgba(255,84,105,.4);background:rgba(255,84,105,.1)}
.pill.ghost{color:var(--fg);border-color:var(--line-hi)} .pill.ghost::before{display:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 14px;border-radius:11px;border:1px solid var(--line-hi);font-weight:600;font-size:13px;background:rgba(255,255,255,.04);transition:background .2s,border-color .2s}
.btn:hover{background:rgba(255,255,255,.09)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent;box-shadow:0 0 24px var(--glow)}
.btn.primary:hover{background:#cbbaff}
.btn.icon{padding:10px}
.btn[aria-pressed="true"]{border-color:var(--accent);background:rgba(187,166,255,.14)}
.tip{position:fixed;z-index:8;left:0;top:0;padding:7px 11px;font-size:12px;pointer-events:none;white-space:nowrap;background:var(--glass-hi);border-radius:10px}
.tip b{font-family:var(--f-data);font-weight:500;margin-right:6px}

/* sheet */
.sheet{position:fixed;z-index:9;top:var(--top);right:var(--gr);bottom:var(--bot);width:min(480px, calc(100vw - 32px));display:flex;flex-direction:column;
  transform:translateX(calc(100% + 60px));transition:transform .55s cubic-bezier(.2,.8,.2,1);border-radius:20px;background:var(--glass-hi);
  -webkit-backdrop-filter:blur(22px) saturate(150%);backdrop-filter:blur(22px) saturate(150%);border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.5)}
.sheet.open{transform:none}
.sheet-inner{overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:16px;overscroll-behavior:contain}
.sh-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.sh-head h2{font-size:28px;margin-top:6px}
.sh-tags{display:flex;gap:6px;flex-wrap:wrap}
.sh-price{font-family:var(--f-display);font-size:34px;line-height:1;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sh-price small{font-family:var(--f-data);font-size:12px;color:var(--muted)}
.specs{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;margin:0;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.specs div{background:var(--ink-2);padding:10px 12px}
.specs dt{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.specs dd{margin:3px 0 0;font-family:var(--f-data);font-size:14px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{padding:9px 12px;font-size:13px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--fg);border-color:var(--accent)}
.planwrap{background:radial-gradient(circle at 50% 40%,rgba(187,166,255,.06),transparent 70%),rgba(255,255,255,.02);border:1px solid var(--line);border-radius:14px;padding:10px}
.planwrap svg{width:100%;height:auto;display:block;max-height:380px}
.plan-wall{fill:none;stroke:#efeaf8;stroke-linejoin:round}
.plan-int{fill:none;stroke:rgba(239,234,248,.75)}
.plan-room{fill:rgba(255,255,255,.025)}
.plan-room.living{fill:rgba(187,166,255,.08)}
.plan-terr{fill:rgba(187,166,255,.13);stroke:var(--accent);stroke-dasharray:.35 .25}
.plan-glz{stroke:#8fd3ff}
.plan-furn{fill:none;stroke:rgba(239,234,248,.35)}
.plan-door{fill:none;stroke:rgba(239,234,248,.55)}
.plan-txt{fill:var(--fg);font-family:var(--f-body);font-weight:600}
.plan-sub{fill:var(--muted);font-family:var(--f-data)}
.plan-n{fill:var(--accent);font-family:var(--f-data)}
.kp-u{stroke:var(--ink);stroke-width:.35}
.kp-u.avail{fill:rgba(61,178,255,.55)} .kp-u.hold{fill:rgba(243,180,67,.55)} .kp-u.sold{fill:rgba(255,84,105,.5)}
.kp-u.sel{fill:var(--accent);filter:drop-shadow(0 0 2px var(--glow))}
.kp-slab{fill:rgba(255,255,255,.06);stroke:rgba(255,255,255,.35);stroke-width:.25}
.kp-core{fill:var(--ink-2);stroke:rgba(255,255,255,.3);stroke-width:.25}
.kp-sea{fill:none;stroke:#7cc8ff;stroke-width:.3;opacity:.7}
.kp-lbl{fill:var(--fg);font-family:var(--f-data)}
.sunbox{display:grid;gap:8px}
.sunrow{display:grid;grid-template-columns:96px 1fr 52px;gap:10px;align-items:center;font-size:12px;color:var(--muted)}
.sunrow .bar{height:6px;border-radius:6px;background:rgba(255,255,255,.07);overflow:hidden}
.sunrow .bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#f6b06a,#ffe3a6)}
.sunrow b{font-family:var(--f-data);font-weight:500;color:var(--fg);text-align:right}
.note{margin:0;font-size:11px;color:var(--dim)}
.sh-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sh-actions .wide{grid-column:1/-1}

/* drawers */
.drawer{position:fixed;z-index:8;left:var(--gl);top:calc(var(--top) + 78px);width:300px;max-height:calc(100% - var(--top) - var(--bot) - 160px);overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px;background:var(--glass-hi)}
.dr-head{display:flex;justify-content:space-between;align-items:center}
.dr-head h3{font-size:20px}
fieldset{border:0;margin:0;padding:0;display:grid;gap:8px}
legend{padding:0;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:7px 11px;border-radius:999px;border:1px solid var(--line-hi);font-size:12.5px;font-weight:600;color:var(--muted);display:flex;gap:7px;align-items:center}
.chips button[aria-pressed="true"]{color:var(--fg);border-color:var(--accent);background:rgba(187,166,255,.13)}
.toggle{display:flex;gap:10px;align-items:center;font-size:13px;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--accent-deep)}
.rng{display:grid;gap:6px;font-size:13px}
.rng span{display:flex;justify-content:space-between;color:var(--muted)}
.rng b{font-family:var(--f-data);font-weight:500;color:var(--fg)}
.rng input{width:100%;accent-color:var(--accent-deep)}
.dr-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.dr-foot p{margin:0;font-size:12.5px;color:var(--muted)} .dr-foot b{color:var(--fg);font-family:var(--f-data)}
.compare{position:fixed;z-index:8;left:50%;transform:translateX(-50%);bottom:calc(var(--bot) + 70px);width:min(880px, calc(100vw - 32px));max-height:52vh;display:flex;flex-direction:column;background:var(--glass-hi)}
.compare .dr-head{padding:14px 16px 10px}
.cmp-scroll{overflow:auto;padding:0 16px 14px}
.cmp{border-collapse:collapse;width:100%;min-width:520px;font-size:12.5px}
.cmp th,.cmp td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.cmp th[scope="row"]{color:var(--muted);font-weight:500;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.cmp td{font-family:var(--f-data)}
.cmp thead th{font-family:var(--f-data);font-size:15px;font-weight:500}
.cmp thead th button{margin-left:6px;vertical-align:middle;color:var(--muted)}
.cmp .best{color:var(--accent)}
.empty{margin:0;padding:6px 0 4px;color:var(--muted);font-size:13px}

/* window HUD */
.whud{position:fixed;z-index:7;bottom:var(--bot);left:50%;transform:translateX(-50%);display:flex;gap:16px;align-items:center;padding:10px 10px 10px 16px;max-width:calc(100vw - 32px);flex-wrap:wrap;justify-content:center}
.whud-info{display:grid;gap:2px;min-width:0}
.whud-info p:last-child{margin:0;font-size:12.5px;display:flex;gap:6px;align-items:center}
.whud-btns{display:flex;gap:6px;flex-wrap:wrap}
.sunflag{width:8px;height:8px;border-radius:50%;background:var(--dim)}
.sunflag.on{background:#ffd27a;box-shadow:0 0 10px #ffb85a}
.hint{position:fixed;z-index:6;left:50%;top:50%;transform:translate(-50%,-50%);padding:10px 16px;font-size:13px;pointer-events:none;animation:fade 3.2s ease forwards}

// Sky r186 ha rimosso la curva di gamma del modello Preetham (cielo notturno nero, esposizione diversa):
// manteniamo lo shader atmosferico calibrato in origine (MIT, three.js r170 examples/jsm/objects/Sky.js)
const SKY_VS = `
		uniform vec3 sunPosition;
		uniform float rayleigh;
		uniform float turbidity;
		uniform float mieCoefficient;
		uniform vec3 up;

		varying vec3 vWorldPosition;
		varying vec3 vSunDirection;
		varying float vSunfade;
		varying vec3 vBetaR;
		varying vec3 vBetaM;
		varying float vSunE;

		// constants for atmospheric scattering
		const float e = 2.71828182845904523536028747135266249775724709369995957;
		const float pi = 3.141592653589793238462643383279502884197169;

		// wavelength of used primaries, according to preetham
		const vec3 lambda = vec3( 680E-9, 550E-9, 450E-9 );
		// this pre-calcuation replaces older TotalRayleigh(vec3 lambda) function:
		// (8.0 * pow(pi, 3.0) * pow(pow(n, 2.0) - 1.0, 2.0) * (6.0 + 3.0 * pn)) / (3.0 * N * pow(lambda, vec3(4.0)) * (6.0 - 7.0 * pn))
		const vec3 totalRayleigh = vec3( 5.804542996261093E-6, 1.3562911419845635E-5, 3.0265902468824876E-5 );

		// mie stuff
		// K coefficient for the primaries
		const float v = 4.0;
		const vec3 K = vec3( 0.686, 0.678, 0.666 );
		// MieConst = pi * pow( ( 2.0 * pi ) / lambda, vec3( v - 2.0 ) ) * K
		const vec3 MieConst = vec3( 1.8399918514433978E14, 2.7798023919660528E14, 4.0790479543861094E14 );

		// earth shadow hack
		// cutoffAngle = pi / 1.95;
		const float cutoffAngle = 1.6110731556870734;
		const float steepness = 1.5;
		const float EE = 1000.0;

		float sunIntensity( float zenithAngleCos ) {
			zenithAngleCos = clamp( zenithAngleCos, -1.0, 1.0 );
			return EE * max( 0.0, 1.0 - pow( e, -( ( cutoffAngle - acos( zenithAngleCos ) ) / steepness ) ) );
		}

		vec3 totalMie( float T ) {
			float c = ( 0.2 * T ) * 10E-18;
			return 0.434 * c * MieConst;
		}

		void main() {

			vec4 worldPosition = modelMatrix * vec4( position, 1.0 );
			vWorldPosition = worldPosition.xyz;

			gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 );
			gl_Position.z = gl_Position.w; // set z to camera.far

			vSunDirection = normalize( sunPosition );

			vSunE = sunIntensity( dot( vSunDirection, up ) );

			vSunfade = 1.0 - clamp( 1.0 - exp( ( sunPosition.y / 450000.0 ) ), 0.0, 1.0 );

			float rayleighCoefficient = rayleigh - ( 1.0 * ( 1.0 - vSunfade ) );

			// extinction (absorbtion + out scattering)
			// rayleigh coefficients
			vBetaR = totalRayleigh * rayleighCoefficient;

			// mie coefficients
			vBetaM = totalMie( turbidity ) * mieCoefficient;

const SKY_FS = `
		varying vec3 vWorldPosition;
		varying vec3 vSunDirection;
		varying float vSunfade;
		varying vec3 vBetaR;
		varying vec3 vBetaM;
		varying float vSunE;

		uniform float mieDirectionalG;
		uniform vec3 up;

		// constants for atmospheric scattering
		const float pi = 3.141592653589793238462643383279502884197169;

		const float n = 1.0003; // refractive index of air
		const float N = 2.545E25; // number of molecules per unit volume for air at 288.15K and 1013mb (sea level -45 celsius)

		// optical length at zenith for molecules
		const float rayleighZenithLength = 8.4E3;
		const float mieZenithLength = 1.25E3;
		// 66 arc seconds -> degrees, and the cosine of that
		const float sunAngularDiameterCos = 0.999956676946448443553574619906976478926848692873900859324;

		// 3.0 / ( 16.0 * pi )
		const float THREE_OVER_SIXTEENPI = 0.05968310365946075;
		// 1.0 / ( 4.0 * pi )
		const float ONE_OVER_FOURPI = 0.07957747154594767;

		float rayleighPhase( float cosTheta ) {
			return THREE_OVER_SIXTEENPI * ( 1.0 + pow( cosTheta, 2.0 ) );
		}

		float hgPhase( float cosTheta, float g ) {
			float g2 = pow( g, 2.0 );
			float inverse = 1.0 / pow( 1.0 - 2.0 * g * cosTheta + g2, 1.5 );
			return ONE_OVER_FOURPI * ( ( 1.0 - g2 ) * inverse );
		}

		void main() {

			vec3 direction = normalize( vWorldPosition - cameraPosition );

			// optical length
			// cutoff angle at 90 to avoid singularity in next formula.
			float zenithAngle = acos( max( 0.0, dot( up, direction ) ) );
			float inverse = 1.0 / ( cos( zenithAngle ) + 0.15 * pow( 93.885 - ( ( zenithAngle * 180.0 ) / pi ), -1.253 ) );
			float sR = rayleighZenithLength * inverse;
			float sM = mieZenithLength * inverse;

			// combined extinction factor
			vec3 Fex = exp( -( vBetaR * sR + vBetaM * sM ) );

			// in scattering
			float cosTheta = dot( direction, vSunDirection );

			float rPhase = rayleighPhase( cosTheta * 0.5 + 0.5 );
			vec3 betaRTheta = vBetaR * rPhase;

			float mPhase = hgPhase( cosTheta, mieDirectionalG );
			vec3 betaMTheta = vBetaM * mPhase;

			vec3 Lin = pow( vSunE * ( ( betaRTheta + betaMTheta ) / ( vBetaR + vBetaM ) ) * ( 1.0 - Fex ), vec3( 1.5 ) );
			Lin *= mix( vec3( 1.0 ), pow( vSunE * ( ( betaRTheta + betaMTheta ) / ( vBetaR + vBetaM ) ) * Fex, vec3( 1.0 / 2.0 ) ), clamp( pow( 1.0 - dot( up, vSunDirection ), 5.0 ), 0.0, 1.0 ) );

			// nightsky
			float theta = acos( direction.y ); // elevation --> y-axis, [-pi/2, pi/2]
			float phi = atan( direction.z, direction.x ); // azimuth --> x-axis [-pi/2, pi/2]
			vec2 uv = vec2( phi, theta ) / vec2( 2.0 * pi, pi ) + vec2( 0.5, 0.0 );
			vec3 L0 = vec3( 0.1 ) * Fex;

			float sundisk = smoothstep( sunAngularDiameterCos, sunAngularDiameterCos + 0.00002, cosTheta );
			L0 += ( vSunE * 19000.0 * Fex ) * sundisk;

			vec3 texColor = ( Lin + L0 ) * 0.04 + vec3( 0.0, 0.0003, 0.00075 );

			vec3 retColor = pow( texColor, vec3( 1.0 / ( 1.2 + ( 1.2 * vSunfade ) ) ) );

			gl_FragColor = vec4( retColor, 1.0 );

			#include <tonemapping_fragment>
			#include <colorspace_fragment>

		}`;

const cloudMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 }, uSun: { value: new THREE.Vector3(0, 1, 0) }, uSunCol: { value: new THREE.Color(1, 1, 1) }, uAmb: { value: new THREE.Color(0.6, 0.65, 0.75) }, uCover: { value: 0.6 }, uOp: { value: 1 } },

function ringSweep(a0, b0, prof, N = 200, n = 4){

}

let tween = null;
const ease = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
function flyTo(pos, target, dur = 1.8, arc = 0.1){
  if (reduceMotion) dur = 0.05;
  return new Promise(res => { if (tween) tween.res(false);
    tween = { p0: camera.position.clone(), t0: controls.target.clone(), p1: pos.clone(), t1: target.clone(), start: performance.now(), dur: dur * 1000, arc: arc * camera.position.distanceTo(pos), res }; });
}
function stepTween(now){
  if (!tween) return false;
  const k = Math.min(1, (now - tween.start) / tween.dur), e = ease(k);
  camera.position.lerpVectors(tween.p0, tween.p1, e); camera.position.y += Math.sin(Math.PI * e) * tween.arc;
  controls.target.lerpVectors(tween.t0, tween.t1, e); camera.lookAt(controls.target);
  if (k >= 1){ const r = tween.res; tween = null; r(true); }
  return true;
}

async function windowView(u, vi = 0, sunStudy = false){
  stopTour(); closeSheet(); cardEl.hidden = true; clearLeader(); tipEl.hidden = true;
  state.mode = 'window'; state.win = { u, vi }; setOverlay(null); setNav(); legendEl.hidden = true;
  const t = TOWERS[u.t];
  const yaw = vi === 0 ? 0 : (u.k % 2 ? -0.62 : 0.62);
  const d = u.dir.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
  const rBal = Math.max(coreR(t, u.m) + 1.4, outlineR(t, u.m, u.f) - 1.2);
  const pos = new THREE.Vector3(t.x + u.dir.x * rBal, u.f * FH + 0.38 + 1.62, t.z + u.dir.z * rBal);
  const tgt = pos.clone().addScaledVector(d, 0.6); tgt.y -= 0.05;
  camera.near = 0.15; camera.updateProjectionMatrix();
  Object.assign(controls, { enablePan: false, enableZoom: false, rotateSpeed: -0.32, minDistance: 0.6, maxDistance: 0.6, minPolarAngle: 1.0, maxPolarAngle: 2.0 });
  $('#wTitle').textContent = `${u.code} · Piano ${u.f} · Vista ${u.expoL}`;
  $$('[data-view]').forEach(b => b.setAttribute('aria-pressed', +b.dataset.view === vi));
  updateWindowSun();
  await flyTo(pos, tgt, vi === 0 && !sunStudy ? 2.4 : 1.2, vi === 0 ? 0.06 : 0);

  if (vi === 0 && !sunStudy && !reduceMotion){ const h = document.createElement('div'); h.className = 'hint glass'; h.textContent = 'Trascina per guardarti intorno'; document.body.append(h); setTimeout(() => h.remove(), 3300); }
  if (sunStudy) startSunStudy();
}

// finestre procedurali in spazio oggetto (navi, terminal): file di cabine con balconi, accese di notte a caso
function patchWindows(mat, { row = 2.9, colw = 3.2, y0 = 4, key, lit = 0.55 }){
  mat.customProgramCacheKey = () => key;
  mat.onBeforeCompile = sh => {
    sh.uniforms.uNight = U.uNight;
    sh.vertexShader = 'varying vec3 vOP; varying vec3 vON;\n' + sh.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\n vOP = position; vON = normal;');
    sh.fragmentShader = 'uniform float uNight; varying vec3 vOP; varying vec3 vON;\n' + sh.fragmentShader
      .replace('#include <map_fragment>', `#include <map_fragment>
        float wv = 1.0 - step(0.5, abs(vON.y));
        float al = abs(vON.x) > abs(vON.z) ? vOP.z : vOP.x;
        float rw = (vOP.y - ${y0.toFixed(2)}) / ${row.toFixed(2)};
        float frw = fract(rw), fcl = fract(al / ${colw.toFixed(2)});
        float win = wv * step(0.0, rw) * step(0.3, frw) * step(frw, 0.84) * step(0.07, fcl) * step(fcl, 0.95);
        float hsh = fract(sin(dot(vec2(floor(al / ${colw.toFixed(2)}), floor(rw)), vec2(12.9898, 78.233))) * 43758.5453);
        diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.045, 0.075, 0.11), win * 0.9);`)
      .replace('#include <roughnessmap_fragment>', '#include <roughnessmap_fragment>\n roughnessFactor = mix(roughnessFactor, 0.1, win);')
      .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
        totalEmissiveRadiance += win * step(${(1 - lit).toFixed(2)}, hsh) * uNight * vec3(1.0, 0.7, 0.42) * 1.3;`);
  };
  return mat;
}

/* ================= filters ================= */
function matches(u){ const F = state.filters; return F.status.has(u.status) && F.rooms.has(u.rooms) && (!F.sea || u.sea) && u.price <= F.priceMax && u.f >= F.floorMin; }
function paintUnit(u){ u.mesh.material = u === state.unit ? selMat : u === state.hover ? hoverMat : u.match ? statusMat[u.status] : ghostMat; u.sprite.visible = u.match || u === state.unit; }
function applyFilters(){
  let n = 0, na = 0; for (const u of units){ u.match = matches(u); if (u.match){ n++; if (u.status === 'avail') na++; } paintUnit(u); }
  $('#fCount').innerHTML = `<b>${n}</b> unità · <b>${na}</b> disponibili`;
  renderPins(); if (state.mode === 'tower') renderLegend();
}
const fPrice = $('#fPrice'), fFloor = $('#fFloor');
fPrice.min = Math.floor(PRICE_MIN / 10000) * 10000; fPrice.max = Math.ceil(PRICE_MAX / 10000) * 10000; fPrice.step = 10000; fPrice.value = fPrice.max;
fFloor.max = Math.max(...TOWERS.map(t => t.floors - 1));
const syncFilterLabels = () => { $('#fPriceV').textContent = fmtEUR.format(+fPrice.value); $('#fFloorV').textContent = fFloor.value; };
syncFilterLabels();
function chipGroup(sel, set, cast){ $(sel).addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; const v = cast(b.dataset.v);
  if (set.has(v) && set.size > 1) set.delete(v); else set.add(v); b.setAttribute('aria-pressed', set.has(v)); applyFilters(); }); }
chipGroup('#fStatus', state.filters.status, v => v); chipGroup('#fRooms', state.filters.rooms, v => +v);
$('#fSea').addEventListener('change', e => { state.filters.sea = e.target.checked; applyFilters(); });
fPrice.addEventListener('input', () => { state.filters.priceMax = +fPrice.value >= +fPrice.max ? Infinity : +fPrice.value; syncFilterLabels(); applyFilters(); });
fFloor.addEventListener('input', () => { state.filters.floorMin = +fFloor.value; syncFilterLabels(); applyFilters(); });
$('#fReset').addEventListener('click', () => { const F = state.filters; F.status = new Set(['avail','hold','sold']); F.rooms = new Set([2,3,4,5]); F.sea = false; F.priceMax = Infinity; F.floorMin = 1;

const _v = new THREE.Vector3();

const LAYOUTS = {
  2: { front: [['Living · cucina', .62, 'living'], ['Camera', .38, 'bed']], back: [['Bagno', .34, 'bath'], ['Ingresso', .36, 'hall'], ['Ripostiglio', .30, 'store']] },
  3: { front: [['Soggiorno', .56, 'living'], ['Padronale', .44, 'bed']], back: [['Cucina', .28, 'kitchen'], ['Ingresso', .18, 'hall'], ['Bagno', .16, 'bath'], ['Bagno', .12, 'bath'], ['Camera', .26, 'bed2']] },
  4: { front: [['Soggiorno', .46, 'living'], ['Padronale', .30, 'bed'], ['Camera', .24, 'bed2']], back: [['Cucina', .24, 'kitchen'], ['Ingresso', .16, 'hall'], ['Bagno', .14, 'bath'], ['Bagno', .12, 'bath'], ['Camera', .22, 'bed2'], ['Lavanderia', .12, 'store']] },
  5: { front: [['Living', .40, 'living'], ['Pranzo', .20, 'dining'], ['Suite', .40, 'bed']], back: [['Cucina', .22, 'kitchen'], ['Camera', .20, 'bed2'], ['Camera', .20, 'bed2'], ['Ingresso', .14, 'hall'], ['Bagno', .12, 'bath'], ['Bagno', .12, 'bath']] },
};
function planSVG(u, mini = false){
  const A = u.area, W = Math.sqrt(A * 1.55), D = A / W, T = Math.min(4.2, Math.max(1.8, u.terrace / W));
  const L = LAYOUTS[u.rooms], yB = D * 0.42, pad = mini ? 0.6 : 1.4, top = mini ? 0.6 : 1.6;
  const vbW = W + pad * 2, vbH = D + T * 1.35 + top + pad;
  const fs = Math.max(0.42, Math.min(0.62, W / 22)), lw = mini ? 0.22 : 0.26;
  let s = `<svg viewBox="${-pad} ${-top} ${vbW.toFixed(2)} ${vbH.toFixed(2)}" role="img" aria-label="Planimetria ${u.code}" xmlns="http://www.w3.org/2000/svg">`;
  s += `<path class="plan-terr" stroke-width="${mini ? .1 : .08}" d="M0 ${D} L0 ${D + T * .7} Q${W / 2} ${D + T * 1.38} ${W} ${D + T * .7} L${W} ${D} Z"/>`;
  const zone = (rooms, y0, y1) => { let x = 0; for (const [n, f, type] of rooms){ const w = W * f, h = y1 - y0;
    s += `<rect class="plan-room ${type}" x="${x}" y="${y0}" width="${w}" height="${h}"/>`;
    if (!mini){
      if (type === 'living'){ const sw = Math.min(3, w * .5); s += `<rect class="plan-furn" stroke-width=".07" x="${x + w / 2 - sw / 2}" y="${y0 + h * .8}" width="${sw}" height=".85" rx=".2"/><rect class="plan-furn" stroke-width=".07" x="${x + w / 2 - sw * .25}" y="${y0 + h * .8 - 1.05}" width="${sw * .5}" height=".55" rx=".12"/>`; }
      if (type === 'bed' || type === 'bed2'){ const bw = type === 'bed' ? 1.7 : 1.0, bh = 2.05; if (w > bw + .8 && h > bh + .6) s += `<rect class="plan-furn" stroke-width=".07" x="${x + w / 2 - bw / 2}" y="${y0 + (type === 'bed' ? .35 : h - bh - .35)}" width="${bw}" height="${bh}" rx=".1"/>`; }
      if (type === 'kitchen'){ s += `<rect class="plan-furn" stroke-width=".07" x="${x + .25}" y="${y0 + .25}" width="${w - .5}" height=".62"/>`; }
      if (type === 'dining'){ s += `<circle class="plan-furn" stroke-width=".07" cx="${x + w / 2}" cy="${y0 + h * .5}" r="${Math.min(.9, w * .25)}"/>`; }
      if (type !== 'hall') s += `<path class="plan-door" stroke-width=".06" d="M${x + .35} ${y1 === D ? y0 : y1} a.85 .85 0 0 ${y1 === D ? 1 : 0} .85 ${y1 === D ? .85 : -.85}"/>`;
      const fz = Math.min(fs, (w - .35) / (n.length * .6));
      const ly = type === 'bed' ? y0 + h * .8 : type === 'bed2' ? y0 + h * .3 : type === 'living' ? y0 + h * .38 : y0 + h / 2;
      if (fz >= .26){ s += `<text class="plan-txt" x="${x + w / 2}" y="${ly}" font-size="${fz.toFixed(2)}" text-anchor="middle">${n}</text>`;
        if (h > 2.6) s += `<text class="plan-sub" x="${x + w / 2}" y="${ly + fz * 1.15}" font-size="${Math.min(fs * .78, (w - .3) / 4.4).toFixed(2)}" text-anchor="middle">${fmt1.format(w * h)} m²</text>`; }
    }
    if (x > 0) s += `<line class="plan-int" stroke-width="${mini ? .14 : .12}" x1="${x}" y1="${y0}" x2="${x}" y2="${y1}"/>`;
    if (y1 === D) s += `<line class="plan-glz" stroke-width="${mini ? .2 : .14}" x1="${x + .5}" y1="${D}" x2="${x + w - .5}" y2="${D}"/>`;
    x += w; } };
  zone(L.back, 0, yB); zone(L.front, yB, D);
  s += `<line class="plan-int" stroke-width="${mini ? .14 : .12}" x1="0" y1="${yB}" x2="${W}" y2="${yB}"/>`;
  s += `<rect class="plan-wall" stroke-width="${lw}" x="0" y="0" width="${W}" height="${D}"/>`;
  if (!mini){
    s += `<text class="plan-sub" x="${W / 2}" y="${D + T * .78}" font-size="${fs * .8}" text-anchor="middle">Terrazzo ${fmt1.format(u.terrace)} m²</text>`;
    const nx = W - .6, ny = -top + .85;
    s += `<g transform="translate(${nx} ${ny}) rotate(${(180 - u.az).toFixed(1)})"><path class="plan-n" d="M0 -.6 L.28 .35 L0 .18 L-.28 .35 Z"/></g><text class="plan-n" x="${nx - .9}" y="${ny + .2}" font-size="${fs * .8}" text-anchor="end">N</text>`;
    s += `<text class="plan-sub" x="0" y="${-top + .9}" font-size="${fs * .8}">Livello ${u.f} · ${u.code} · fronte ${u.expoL}</text>`;
  }
  return s + '</svg>';
}
function keyPlanSVG(u){
  const t = TOWERS[u.t], S = t.R * 1.35, sc = 1;
  const P = (r, th) => `${(r * Math.cos(th) * sc).toFixed(2)},${(r * Math.sin(th) * sc).toFixed(2)}`;
  let s = `<svg viewBox="${-S - 10} ${-S - 4} ${2 * S + 14} ${2 * S + 8}" role="img" aria-label="Pianta del piano ${u.f}" xmlns="http://www.w3.org/2000/svg">`;
  for (let i = 0; i < 4; i++){ const y = -8 + i * 5; s += `<path class="kp-sea" d="M${-S - 9} ${y} q1.5 -1.2 3 0 t3 0"/>`; }
  s += `<text class="kp-lbl" x="${-S - 9}" y="${12}" font-size="2.2" opacity=".7">MARE</text>`;
  const slab = []; for (let i = 0; i < 120; i++){ const th = i / 120 * TAU; slab.push(P(outlineR(t, th, u.f), th)); }
  s += `<polygon class="kp-slab" points="${slab.join(' ')}"/>`;
  for (const v of units.filter(x => x.t === u.t && x.f === u.f)){
    const pts = [], n = 30; for (let i = 0; i <= n; i++){ const th = v.th0 + .02 + (v.th1 - v.th0 - .04) * i / n; pts.push(P(outlineR(t, th, u.f) * .96, th)); }
    for (let i = n; i >= 0; i--){ const th = v.th0 + .06 + (v.th1 - v.th0 - .12) * i / n; pts.push(P(t.R * INNER + .6, th)); }
    s += `<polygon class="kp-u ${v === u ? 'sel' : v.status}" points="${pts.join(' ')}"/>`;
    const lr = (coreR(t, v.m) + t.R * INNER) / 2; s += `<text class="kp-lbl" x="${(lr * Math.cos(v.m)).toFixed(2)}" y="${(lr * Math.sin(v.m) + .8).toFixed(2)}" font-size="${v.nU >= 6 ? 1.9 : 2.2}" text-anchor="middle">${v.code.slice(-2)}</text>`;
  }
  s += `<circle class="kp-core" r="${(t.R * INNER - .3).toFixed(2)}"/>`;
  s += `<text class="plan-n" x="${S + 1}" y="${-S + 2}" font-size="2.4" text-anchor="middle">N</text><path class="plan-n" d="M${S + 1} ${-S + 3.2} l1.1 3 -1.1 -.7 -1.1 .7z"/>`;
  return s + '</svg>';
}

    const rx = Math.cos(HELI.yaw), rz = -Math.sin(HELI.yaw); W.x = HELI.p.x + rx * 4; W.z = HELI.p.z + rz * 4; pushOut(W, 0.4, 0); W.yaw = HELI.yaw; W.pitch = 0; EX.sub = 'walk'; updateXUI(); }
}

$('#xAct').addEventListener('click', interact); $('#xCam').addEventListener('click', toggleCam); $('#xExit').addEventListener('click', exitExplore);

const _q = new THREE.Quaternion(), _e = new THREE.Euler(), _up = new THREE.Vector3(), _v3 = new THREE.Vector3(), _cam = new THREE.Vector3(), _qLook = new THREE.Quaternion();
let clusterT = 0, mapT = 0, panelT = 0;
function updateWalk(dt){

  const run = key('ShiftLeft', 'ShiftRight') || EX.runBtn, spd = run ? 6.8 : 1.9; let mx = f, mz = s; const l = Math.hypot(mx, mz); if (l > 1){ mx /= l; mz /= l; }
  const fx = -Math.sin(W.yaw), fz = -Math.cos(W.yaw), rx = Math.cos(W.yaw), rz = -Math.sin(W.yaw);
  W.x += (fx * mx + rx * mz) * spd * dt; W.z += (fz * mx + rz * mz) * spd * dt; pushOut(W, 0.4, 0);
  W.yaw -= stickR.x * 2.0 * dt; W.pitch = clamp(W.pitch - stickR.y * 1.4 * dt, -1.35, 1.35);

  if (msg !== EX.prompt){ EX.prompt = msg; xPrompt.textContent = msg; xPrompt.hidden = !msg; }

}
function updateCarSim(dt, drive){
  const thr = drive ? clamp(key('KeyW', 'ArrowUp') - key('KeyS', 'ArrowDown') - stickL.y, -1, 1) : 0;
  const st = drive ? clamp(key('KeyA', 'ArrowLeft') - key('KeyD', 'ArrowRight') - stickL.x, -1, 1) : 0, hb = drive && key('Space');

function updateCarCam(dt){

  else { const a = CAR.yaw + EX.look.yaw; _cam.set(CAR.x + Math.sin(a) * 7.5, 2.7 + EX.look.pitch * 4, CAR.z + Math.cos(a) * 7.5); camera.position.lerp(_cam, Math.min(1, dt * 5)); camera.lookAt(CAR.x - Math.sin(CAR.yaw) * 3, 1.1, CAR.z - Math.cos(CAR.yaw) * 3); }
  const kmh = Math.abs(CAR.v) * 3.6, g = gearOf(CAR.v); xRead.textContent = `${Math.round(kmh)} km/h · ${typeof g === 'number' ? 'D' + g : g}`;
}
function updateHeliSim(dt, fly){

function updateHeliCam(dt){
  if (!(EX.drag || (EX.cam === 'in' && stickR.id !== null))) { EX.look.yaw *= 1 - Math.min(1, dt * 1.0); EX.look.pitch *= 1 - Math.min(1, dt * 1.0); }
  if (EX.cam === 'in'){ _cam.set(-0.32, 1.98, -0.72); heliG.localToWorld(_cam); camera.position.copy(_cam); _e.set(EX.look.pitch - 0.12, EX.look.yaw, 0, 'YXZ'); _qLook.setFromEuler(_e); camera.quaternion.copy(_q).multiply(_qLook); }

function updateExplore(dt){
  const t = performance.now();
  updateCarSim(dt, EX.sub === 'car'); updateHeliSim(dt, EX.sub === 'heli');
  if (EX.sub === 'walk') updateWalk(dt); else if (EX.sub === 'car') updateCarCam(dt); else updateHeliCam(dt);

/* ================= loop ================= */
// r183+: Timer sostituisce Clock (si ferma con la tab nascosta)
const clock = new THREE.Timer(); clock.connect(document); const rose = $('#rose'); let tAcc = 0;
// risoluzione adattiva: media del frame time su 2 s, scende/sale il pixel ratio con isteresi (fill-rate ∝ ratio²)

}
const statsEl = STATS ? Object.assign(document.createElement('div'), { style: 'position:fixed;left:12px;bottom:84px;z-index:99;font:11px/1.45 ui-monospace,monospace;color:#d8d0ff;background:rgba(12,10,20,.72);padding:6px 9px;border-radius:8px;border:1px solid rgba(160,130,255,.25);pointer-events:none;white-space:pre' }) : null;

const { set: set0 } = sunTimes(doy());
